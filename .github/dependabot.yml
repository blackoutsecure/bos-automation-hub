version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      github-actions:
        patterns:
          - "actions/*"

# >>> managed-file-sync:dependabot_actions >>>
# Managed by Blackout Secure. Best practices applied via marketplace config, customized in .github/workflow-configs/managed-file-sync-global-config.json and .github/workflow-configs/bos-universal-config.json.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
# <<< managed-file-sync:dependabot_actions <<<

# >>> managed-file-sync:dependabot_pip >>>
# Managed by Blackout Secure. Best practices applied via marketplace config, customized in .github/workflow-configs/managed-file-sync-global-config.json and .github/workflow-configs/bos-universal-config.json.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - python
