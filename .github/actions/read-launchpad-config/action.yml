name: Read launchpad config
description: Read and validate bos-launchpad-config.json, then emit compact JSON.

inputs:
  config_path:
    description: Path to the launchpad config JSON file.
    required: false
    default: bos-launchpad-config.json
  allow_missing:
    description: Emit {} when config file is missing instead of failing.
    required: false
    default: 'false'

outputs:
  cfg:
    description: Compact JSON object for downstream fromJson usage.
    value: ${{ steps.read.outputs.cfg }}

runs:
  using: composite
  steps:
    - name: Read config
      id: read
      shell: bash
      run: |
        set -euo pipefail
        cfg_file='${{ inputs.config_path }}'
        allow_missing='${{ inputs.allow_missing }}'

        if [[ ! -f "$cfg_file" ]]; then
          if [[ "$allow_missing" == 'true' ]]; then
            cfg='{}'
          else
            echo "::error file=$cfg_file::Required config file not found."
            exit 1
          fi
        else
          if ! cfg="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding="utf-8"),), separators=(",", ":")))' "$cfg_file")"; then
            echo "::error file=$cfg_file::JSON parse error (see preceding python output)."
            exit 1
          fi
        fi

        if ! echo "$cfg" | python3 -c 'import json,sys; obj=json.loads(sys.stdin.read());
if not isinstance(obj, dict):
  raise SystemExit("Top-level config must be a JSON object")' >/dev/null; then
          echo "::error file=$cfg_file::Top-level config must be a JSON object."
          exit 1
        fi

        {
          echo "cfg<<__BOS_EOF__"
          echo "$cfg"
          echo "__BOS_EOF__"
        } >> "$GITHUB_OUTPUT"
