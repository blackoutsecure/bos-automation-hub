name: Job report
description: >-
  Standardized Blackout Secure run report. Renders the canonical audit
  layout used by `bos-code-scanning-kit`, `bos-managed-file-sync-action`,
  and `check-readme-header` — verdict, severity-count table, recommended
  actions, grouped findings tables, and a configuration-used table — to
  `$GITHUB_STEP_SUMMARY`, emits matching workflow annotations, and
  resolves a single severity-tier `outcome` for downstream gating.

  Findings are pure data, so any workflow or composite can adopt the same
  report by passing a JSON array instead of hand-rolling another summary
  block.

inputs:
  title:
    description: Report H1, e.g. `Blackout Secure Security Gate Report`.
    required: true
  findings:
    description: >-
      JSON array of finding objects. Each entry accepts `id`, `severity`
      (`pass` | `warn` | `fail` | `skip`), `control`, `evidence`,
      `remediation`, and `group`. Only `severity` is required.
    required: false
    default: '[]'
  groups:
    description: >-
      Optional JSON object mapping a finding `group` key to
      `{"title": ..., "blurb": ...}`. Groups render in declaration order;
      findings whose group is undeclared fall into a trailing `Other`
      section. When empty, every finding renders in one table.
    required: false
    default: '{}'
  context_rows:
    description: >-
      Optional JSON array of `{"label", "value", "meaning"}` objects
      rendered as the `Configuration used` table, mirroring the sync
      action's config-cascade disclosure.
    required: false
    default: '[]'
  subject:
    description: Optional one-line subject shown under the summary heading.
    required: false
    default: ''
  fail_on:
    description: >-
      `fail` (default) exits non-zero when any finding is `fail`. `warn`
      also fails on warnings. `never` always exits 0 so a caller can gate
      on the `outcome` output instead.
    required: false
    default: fail
  enable_summary:
    description: '`false` to skip writing `$GITHUB_STEP_SUMMARY`.'
    required: false
    default: 'true'
  enable_annotations:
    description: '`false` to skip `::error::` / `::warning::` annotations.'
    required: false
    default: 'true'
  footer:
    description: Italic provenance line rendered under the report.
    required: false
    default: ''

outputs:
  outcome:
    description: '`success`, `warn`, or `failure` — severity tier only, independent of `fail_on`.'
    value: ${{ steps.report.outputs.outcome }}
  verdict:
    description: Human-readable verdict line.
    value: ${{ steps.report.outputs.verdict }}
  passes:
    description: Count of `pass` findings.
    value: ${{ steps.report.outputs.passes }}
  warns:
    description: Count of `warn` findings.
    value: ${{ steps.report.outputs.warns }}
  fails:
    description: Count of `fail` findings.
    value: ${{ steps.report.outputs.fails }}
  skips:
    description: Count of `skip` findings.
    value: ${{ steps.report.outputs.skips }}
  total:
    description: Total finding count.
    value: ${{ steps.report.outputs.total }}

runs:
  using: composite
  steps:
    - name: Render report
      id: report
      shell: bash
      env:
        REPORT_TITLE: ${{ inputs.title }}
        REPORT_FINDINGS: ${{ inputs.findings }}
        REPORT_GROUPS: ${{ inputs.groups }}
        REPORT_CONTEXT_ROWS: ${{ inputs.context_rows }}
        REPORT_SUBJECT: ${{ inputs.subject }}
        REPORT_FAIL_ON: ${{ inputs.fail_on }}
        REPORT_ENABLE_SUMMARY: ${{ inputs.enable_summary }}
        REPORT_ENABLE_ANNOTATIONS: ${{ inputs.enable_annotations }}
        REPORT_FOOTER: ${{ inputs.footer }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys

        SEVERITY_LABEL = {
            "pass": "Pass",
            "warn": "Warning",
            "fail": "High",
            "skip": "Not Assessed",
        }
        SEVERITY_MEANING = {
            "pass": "Control satisfied.",
            "warn": "Advisory drift; review recommended but not blocking by itself.",
            "fail": "Required control failed and must be corrected.",
            "skip": "Not evaluated on this run; no verdict can be inferred.",
        }

        def fatal(message):
            print(f"::error title=Job report::{message}", file=sys.stderr)
            sys.exit(1)

        def parse_json(name, raw, expected, default):
            raw = (raw or "").strip()
            if not raw:
                return default
            try:
                value = json.loads(raw)
            except json.JSONDecodeError as exc:
                fatal(f"{name} must be valid JSON ({exc.msg} at line {exc.lineno}).")
            if not isinstance(value, expected):
                fatal(f"{name} must be a JSON {expected.__name__}.")
            return value

        title = (os.environ.get("REPORT_TITLE") or "").strip()
        if not title:
            fatal("`title` is required.")

        findings = parse_json("findings", os.environ.get("REPORT_FINDINGS"), list, [])
        groups = parse_json("groups", os.environ.get("REPORT_GROUPS"), dict, {})
        context_rows = parse_json("context_rows", os.environ.get("REPORT_CONTEXT_ROWS"), list, [])
        subject = (os.environ.get("REPORT_SUBJECT") or "").strip()
        fail_on = (os.environ.get("REPORT_FAIL_ON") or "fail").strip().lower()
        if fail_on not in {"fail", "warn", "never"}:
            fatal("`fail_on` must be one of `fail`, `warn`, `never`.")
        want_summary = (os.environ.get("REPORT_ENABLE_SUMMARY") or "true").lower() == "true"
        want_annotations = (
            os.environ.get("REPORT_ENABLE_ANNOTATIONS") or "true"
        ).lower() == "true"
        footer = (os.environ.get("REPORT_FOOTER") or "").strip()

        def cell(value):
            text = " ".join(str(value if value is not None else "").split())
            return text.replace("|", "\\|") or "—"

        normalized = []
        for index, entry in enumerate(findings):
            if not isinstance(entry, dict):
                fatal(f"findings[{index}] must be an object.")
            severity = str(entry.get("severity", "")).strip().lower()
            if severity not in SEVERITY_LABEL:
                fatal(
                    f"findings[{index}].severity must be one of "
                    f"{', '.join(sorted(SEVERITY_LABEL))}."
                )
            normalized.append({
                "id": str(entry.get("id") or f"BR{index + 1:03d}"),
                "severity": severity,
                "control": str(entry.get("control") or "—"),
                "evidence": str(entry.get("evidence") or "—"),
                "remediation": str(entry.get("remediation") or "—"),
                "group": str(entry.get("group") or ""),
            })

        counts = {key: 0 for key in SEVERITY_LABEL}
        for finding in normalized:
            counts[finding["severity"]] += 1

        if counts["fail"]:
            outcome, verdict = "failure", "Action required"
            verdict_detail = "One or more required controls failed on this run."
        elif counts["warn"]:
            outcome, verdict = "warn", "Advisory review recommended"
            verdict_detail = (
                "No blocking failures were detected, but one or more controls "
                "should be reviewed."
            )
        else:
            outcome, verdict = "success", "Controls passed"
            verdict_detail = "No failing or warning-level findings were detected."

        actions = []
        if counts["fail"]:
            actions.append("Correct the High findings below before merging or releasing.")
        if counts["warn"]:
            actions.append("Review the Warning findings during the next maintenance pass.")
        if counts["skip"]:
            actions.append(
                "Not Assessed rows mean evidence was unavailable — supply the required "
                "credentials or enable the gate to convert them into real verdicts."
            )
        if not counts["fail"] and not counts["warn"]:
            actions.append("Maintain the current configuration — no changes needed.")
        actions.append("Re-run this workflow after remediating to confirm the fix.")

        # Declared groups render first, in declaration order; anything
        # referencing an undeclared group collects into a trailing section.
        ordered_groups = []
        for key, meta in groups.items():
            if not isinstance(meta, dict):
                fatal(f"groups.{key} must be an object.")
            ordered_groups.append((key, str(meta.get("title") or key), str(meta.get("blurb") or "")))
        declared = {key for key, _, _ in ordered_groups}
        if any(finding["group"] not in declared for finding in normalized):
            ordered_groups.append(
                ("", "Other findings" if declared else "Findings", "")
            )

        lines = [
            f"# {title}",
            "",
            "**Provided by [Blackout Secure](https://blackoutsecure.app)**",
            "",
            "## Summary",
            "",
        ]
        if subject:
            lines.extend([subject, ""])
        lines.extend([
            f"**Verdict:** {verdict}",
            "",
            verdict_detail,
            "",
            f"**Totals:** {counts['pass']} pass · {counts['warn']} warning · "
            f"{counts['fail']} high · {counts['skip']} not assessed",
            "",
            "| Severity | Count | Meaning |",
            "| -------- | ----- | ------- |",
        ])
        for key in ("pass", "warn", "fail", "skip"):
            lines.append(
                f"| {SEVERITY_LABEL[key]} | {counts[key]} | {SEVERITY_MEANING[key]} |"
            )
        lines.append("")

        if context_rows:
            lines.extend([
                "## Configuration used",
                "",
                "| Setting | Value | What it means |",
                "| ------- | ----- | ------------- |",
            ])
            for index, row in enumerate(context_rows):
                if not isinstance(row, dict):
                    fatal(f"context_rows[{index}] must be an object.")
                lines.append(
                    f"| {cell(row.get('label'))} | `{cell(row.get('value'))}` | "
                    f"{cell(row.get('meaning'))} |"
                )
            lines.append("")

        lines.extend(["## Recommended Actions", ""])
        lines.extend(f"- {action}" for action in actions)
        lines.append("")

        if normalized:
            lines.extend(["## Detailed Findings", ""])
            for key, group_title, blurb in ordered_groups:
                if key:
                    rows = [f for f in normalized if f["group"] == key]
                else:
                    rows = [f for f in normalized if f["group"] not in declared]
                if not rows:
                    continue
                lines.append(f"### {group_title}")
                if blurb:
                    lines.append(f"_{blurb}_")
                lines.extend([
                    "",
                    "| Rule | Severity | Control | Evidence | Recommended Remediation |",
                    "| ---- | -------- | ------- | -------- | ----------------------- |",
                ])
                for finding in rows:
                    lines.append(
                        f"| `{cell(finding['id'])}` | {SEVERITY_LABEL[finding['severity']]} | "
                        f"{cell(finding['control'])} | {cell(finding['evidence'])} | "
                        f"{cell(finding['remediation'])} |"
                    )
                lines.append("")

        if footer:
            lines.extend(["---", "", f"_{footer}_", ""])

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if want_summary and summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write("\n".join(lines) + "\n")

        print("")
        print(f"━━ {title} — outcome: {outcome} ━━")
        for finding in normalized:
            print(
                f"  {finding['id']:<10} {finding['severity']:<5} "
                f"{finding['control']}: {finding['evidence']}"
            )
        print(f"  verdict: {verdict} — {verdict_detail}")
        print("")

        if want_annotations:
            for finding in normalized:
                if finding["severity"] == "fail":
                    level = "error"
                elif finding["severity"] == "warn":
                    level = "warning"
                else:
                    continue
                print(
                    f"::{level} title={title}::{finding['id']} "
                    f"{finding['control']}: {finding['evidence']} — {finding['remediation']}"
                )

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"outcome={outcome}\n")
            handle.write(f"verdict={verdict}\n")
            handle.write(f"passes={counts['pass']}\n")
            handle.write(f"warns={counts['warn']}\n")
            handle.write(f"fails={counts['fail']}\n")
            handle.write(f"skips={counts['skip']}\n")
            handle.write(f"total={len(normalized)}\n")

        if fail_on == "fail" and counts["fail"]:
            sys.exit(1)
        if fail_on == "warn" and (counts["fail"] or counts["warn"]):
            sys.exit(1)
        PY
