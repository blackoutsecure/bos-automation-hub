name: Universal config
description: Universal config reader for .github/workflow-configs/bos-universal-config.json.

inputs:
  config_path:
    description: Path to the config JSON file.
    required: false
    default: .github/workflow-configs/bos-universal-config.json
  allow_missing:
    description: Emit {} when config file is missing instead of failing.
    required: false
    default: 'false'
  require_marketplace_enabled:
    description: Fail unless `marketplace.enabled` is `true` in the parsed config.
    required: false
    default: 'false'

outputs: {cfg: {description: 'Compact JSON object for downstream fromJson usage.', value: '${{ steps.config.outputs.cfg }}'}, cloudflare: {description: 'Normalized Cloudflare block derived from the config.', value: '${{ steps.config.outputs.cloudflare }}'}, action_test: {description: 'Normalized action_test block derived from the config.', value: '${{ steps.config.outputs.action_test }}'}}

runs:
  using: composite
  steps:
    - name: Read, normalize, and summarize config
      id: config
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config_path }}
        ALLOW_MISSING: ${{ inputs.allow_missing }}
        REQUIRE_MARKETPLACE_ENABLED: ${{ inputs.require_marketplace_enabled }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys

        config_path = os.environ.get("CONFIG_PATH") or ".github/workflow-configs/bos-universal-config.json"
        allow_missing = (os.environ.get("ALLOW_MISSING") or "false").lower() == "true"
        require_marketplace_enabled = (os.environ.get("REQUIRE_MARKETPLACE_ENABLED") or "false").lower() == "true"
        output_path = os.environ["GITHUB_OUTPUT"]
        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

        def error(message):
            print(message, file=sys.stderr)

        if not os.path.isfile(config_path):
            if allow_missing:
                cfg = {}
            else:
                error(f"::error file={config_path}::Required config file not found.")
                sys.exit(1)
        else:
            with open(config_path, encoding="utf-8") as handle:
                raw = handle.read()
            try:
                cfg = json.loads(raw)
            except json.JSONDecodeError as exc:
                error(
                    f"::error file={config_path},line={exc.lineno},col={exc.colno}::"
                    f"Invalid JSON ({exc.msg}) at line {exc.lineno}, column {exc.colno}."
                )
                sys.exit(1)

        if not isinstance(cfg, dict):
            error(f"::error file={config_path}::Top-level config must be a JSON object.")
            sys.exit(1)

        # Optional service-grouped authoring layout: consumers may nest a
        # service's settings under a named section ("launchpad", "security",
        # "sync") instead of (or alongside) the flat top-level
        # keys. Sections are hoisted to the flat keys every downstream
        # normalizer already reads, so both layouts — and any mix of the
        # two — resolve identically. A flat key already present at the top
        # level always wins over its section-nested equivalent.
        #
        # "security": { ...same fields as top-level "gate"... }
        # "sync":     { ...same fields as top-level "managed_file_sync"... }
        # "launchpad": { "upstream": {...}, "docker": {...}, ... }
        # "general":  catch-all for keys owned by neither named service
        #             (e.g. "action_test"); every key is
        #             hoisted as-is, unlike the fixed per-section allowlists
        #             above, since new standalone services land here first.
        #
        # `code_scanning` and `marketplace_kit` are intentionally preserved
        # verbatim. Their published actions own their full schemas and merge
        # the hub global policy with this repository-level config.
        WHOLE_SECTION_ALIASES = {"security": "gate", "sync": "managed_file_sync"}
        LAUNCHPAD_SUBKEYS = (
            "upstream", "stages", "docker", "scout", "balena",
            "companion_docker", "release", "platforms", "security_scan",
            "repo_metadata", "cloudflare", "triggers",
        )

        def hoist_sections(cfg):
            for section_name, flat_key in WHOLE_SECTION_ALIASES.items():
                section = cfg.get(section_name)
                if isinstance(section, dict) and flat_key not in cfg:
                    cfg[flat_key] = section
            launchpad_section = cfg.get("launchpad")
            if isinstance(launchpad_section, dict):
                for subkey in LAUNCHPAD_SUBKEYS:
                    if subkey not in cfg and subkey in launchpad_section:
                        cfg[subkey] = launchpad_section[subkey]
            general_section = cfg.get("general")
            if isinstance(general_section, dict):
                for key, value in general_section.items():
                    if key not in cfg:
                        cfg[key] = value

        hoist_sections(cfg)

        def as_dict(value):
            return value if isinstance(value, dict) else {}

        def as_list(value):
            return value if isinstance(value, list) else []

        def as_int(value, default):
            if isinstance(value, bool):
                return default
            if isinstance(value, int):
                return value
            if isinstance(value, str) and value.strip():
                try:
                    return int(value.strip())
                except ValueError:
                    return default
            return default

        def marketplace_paths(value, field):
            if value is None:
                return ""
            if not isinstance(value, list):
                error(
                    f"::error file={config_path}::marketplace.{field} must be an "
                    "array of strings."
                )
                sys.exit(1)
            paths = []
            for index, path in enumerate(value):
                if not isinstance(path, str) or not path.strip():
                    error(
                        f"::error file={config_path}::marketplace.{field}[{index}] "
                        "must be a non-empty string."
                    )
                    sys.exit(1)
                paths.append(path.strip())
            return "\n".join(paths)

        stages = as_dict(cfg.get("stages"))
        upstream = as_dict(cfg.get("upstream"))
        release = as_dict(cfg.get("release"))
        cloudflare_raw = as_dict(cfg.get("cloudflare"))
        redirects = as_dict(cloudflare_raw.get("redirects"))
        headers = as_dict(cloudflare_raw.get("headers"))
        sync_raw = as_dict(cfg.get("managed_file_sync"))
        marketplace_raw = as_dict(cfg.get("marketplace"))

        marketplace = dict(marketplace_raw)
        for path_field in (
            "allowlist_paths",
            "blocked_paths",
            "required_paths",
            "extra_sync_paths",
        ):
            marketplace[path_field] = marketplace_paths(
                marketplace_raw.get(path_field), path_field
            )
        cfg["marketplace"] = marketplace

        if require_marketplace_enabled and marketplace.get("enabled") is not True:
            error(f"::error file={config_path}::marketplace.enabled must be true")
            sys.exit(1)

        cloudflare = {
            "enabled": stages.get("cloudflare_pages") is True or bool(cloudflare_raw.get("project_name")),
            "project_name": str(cloudflare_raw.get("project_name") or ""),
            "deployment_environment": str(cloudflare_raw.get("deployment_environment") or ""),
            "site_url": str(cloudflare_raw.get("site_url") or ""),
            "public_dir": str(cloudflare_raw.get("public_dir") or "."),
            "deploy_dir": str(cloudflare_raw.get("deploy_dir") or "./dist"),
            "clean_deploy_dir": cloudflare_raw.get("clean_deploy_dir") is not False,
            "copy_files": str(cloudflare_raw.get("copy_files") or ""),
            "copy_dirs": str(cloudflare_raw.get("copy_dirs") or ""),
            "prebuild_command": str(cloudflare_raw.get("prebuild_command") or ""),
            "working_directory": str(cloudflare_raw.get("working_directory") or ""),
            "branch": str(cloudflare_raw.get("branch") or ""),
            "commit_message": str(cloudflare_raw.get("commit_message") or ""),
            "wrangler_version": str(cloudflare_raw.get("wrangler_version") or ""),
            "extra_wrangler_args": str(cloudflare_raw.get("extra_wrangler_args") or ""),
            "ai_bindings": as_list(cloudflare_raw.get("ai_bindings")),
            "deploy_artifact_name": str(cloudflare_raw.get("deploy_artifact_name") or ""),
            "deploy": str(cloudflare_raw.get("deploy") or ""),
            "runs_on": str(cloudflare_raw.get("runs_on") or ""),
            "checkout_fetch_depth": as_int(cloudflare_raw.get("checkout_fetch_depth"), 0),
            "purge_cache": cloudflare_raw.get("purge_cache") is not False,
            "generate_sitemap": cloudflare_raw.get("generate_sitemap") is True,
            "generate_robots": cloudflare_raw.get("generate_robots") is True,
            "generate_security_txt": cloudflare_raw.get("generate_security_txt") is True,
            "generate_humans_txt": cloudflare_raw.get("generate_humans_txt") is True,
            "security_contact": str(cloudflare_raw.get("security_contact") or ""),
            "generate_manifest": cloudflare_raw.get("generate_manifest") is True,
            "manifest_name": str(cloudflare_raw.get("manifest_name") or ""),
            "manifest_short_name": str(cloudflare_raw.get("manifest_short_name") or ""),
            "manifest_description": str(cloudflare_raw.get("manifest_description") or ""),
            "manifest_orientation": str(cloudflare_raw.get("manifest_orientation") or ""),
            "manifest_theme_color": str(cloudflare_raw.get("manifest_theme_color") or ""),
            "manifest_background_color": str(cloudflare_raw.get("manifest_background_color") or ""),
            "manifest_lang": str(cloudflare_raw.get("manifest_lang") or ""),
            "manifest_dir": str(cloudflare_raw.get("manifest_dir") or ""),
            "manifest_categories": str(cloudflare_raw.get("manifest_categories") or ""),
            "manifest_icons_dir": str(cloudflare_raw.get("manifest_icons_dir") or ""),
            "generate_redirects": redirects.get("generate") is True or cloudflare_raw.get("generate_redirects") is True,
            "redirects_custom_rules": str(redirects.get("custom_rules") or cloudflare_raw.get("redirects_custom_rules") or ""),
            "redirects_replace_existing": redirects.get("replace_existing") is True or cloudflare_raw.get("redirects_replace_existing") is True,
            "generate_headers": headers.get("generate") is True or cloudflare_raw.get("generate_headers") is True,
            "headers_presets": str(headers.get("presets") or cloudflare_raw.get("headers_presets") or "security,cache"),
            "headers_csp": str(headers.get("csp") or cloudflare_raw.get("headers_csp") or ""),
            "headers_hsts_max_age": str(headers.get("hsts_max_age") or cloudflare_raw.get("headers_hsts_max_age") or "63072000"),
            "headers_permissions_policy": str(
                headers.get("permissions_policy")
                or cloudflare_raw.get("headers_permissions_policy")
                or "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
            ),
            "headers_cache_html_control": str(
                headers.get("cache_html_control")
                or cloudflare_raw.get("headers_cache_html_control")
                or "public, max-age=0, must-revalidate"
            ),
            "headers_cache_assets_pattern": str(
                headers.get("cache_assets_pattern")
                or cloudflare_raw.get("headers_cache_assets_pattern")
                or "/assets/*"
            ),
            "headers_cache_assets_control": str(
                headers.get("cache_assets_control")
                or cloudflare_raw.get("headers_cache_assets_control")
                or "public, max-age=31536000, immutable"
            ),
            "generate_common_content_headers": (
                headers.get("generate_common_content_headers") is not False
                and cloudflare_raw.get("generate_common_content_headers") is not False
            ),
            "common_security_txt_cache_control": str(
                headers.get("common_security_txt_cache_control")
                or cloudflare_raw.get("common_security_txt_cache_control")
                or "public, max-age=86400"
            ),
            "common_robots_txt_cache_control": str(
                headers.get("common_robots_txt_cache_control")
                or cloudflare_raw.get("common_robots_txt_cache_control")
                or "public, max-age=86400"
            ),
            "common_sitemap_xml_cache_control": str(
                headers.get("common_sitemap_xml_cache_control")
                or cloudflare_raw.get("common_sitemap_xml_cache_control")
                or "public, max-age=86400"
            ),
            "common_humans_txt_cache_control": str(
                headers.get("common_humans_txt_cache_control")
                or cloudflare_raw.get("common_humans_txt_cache_control")
                or "public, max-age=86400"
            ),
            "headers_custom_rules": str(headers.get("custom_rules") or cloudflare_raw.get("headers_custom_rules") or ""),
            "headers_replace_existing": headers.get("replace_existing") is True or cloudflare_raw.get("headers_replace_existing") is True,
        }

        sync_services = [
            service.strip()
            for service in as_list(sync_raw.get("services"))
            if isinstance(service, str) and service.strip()
        ]
        sync = {
            "enabled": bool(sync_services),
            "services": sync_services,
            "mode": str(sync_raw.get("mode") or "commit"),
            "generate_commit_message": sync_raw.get("generate_commit_message") is not False,
            "commit_message": str(sync_raw.get("commit_message") or ""),
            "fallback_commit_message": str(
                sync_raw.get("fallback_commit_message")
                or "chore: sync managed files from bos-automation-hub"
            ),
            "git_user_name": str(sync_raw.get("git_user_name") or "github-actions[bot]"),
            "git_user_email": str(sync_raw.get("git_user_email") or "41898282+github-actions[bot]@users.noreply.github.com"),
            "push_retries": as_int(sync_raw.get("push_retries"), 3),
            "runs_on": str(sync_raw.get("runs_on") or "ubuntu-latest"),
            "timeout_minutes": as_int(sync_raw.get("timeout_minutes"), 5),
        }

        action_test_raw = as_dict(cfg.get("action_test"))
        action_test_python_versions = [
            str(version).strip()
            for version in as_list(action_test_raw.get("python_versions"))
            if str(version).strip()
        ]
        action_test_os_matrix = [
            str(runner).strip()
            for runner in as_list(action_test_raw.get("os_matrix"))
            if str(runner).strip()
        ]
        action_test_python_packages = [
            str(package).strip()
            for package in as_list(action_test_raw.get("python_packages"))
            if str(package).strip()
        ]
        smoke_test_config = action_test_raw.get("smoke_test_config")
        if smoke_test_config is None:
            smoke_test_config = {}
        if not isinstance(smoke_test_config, dict):
            error(
                f"::error file={config_path}::action_test.smoke_test_config must be an object."
            )
            sys.exit(1)

        action_test = {
            "python_versions": action_test_python_versions or ["3.11"],
            "os_matrix": action_test_os_matrix or ["ubuntu-latest"],
            "python_packages": action_test_python_packages or [
                "pytest>=8.0",
                "ruff>=0.6",
                "PyYAML>=6.0",
            ],
            "pytest_args": str(action_test_raw.get("pytest_args") or "-q"),
            "enable_smoke_test": action_test_raw.get("enable_smoke_test") is True,
            "smoke_trigger": str(action_test_raw.get("smoke_trigger") or "push-dev"),
            "smoke_test_config": smoke_test_config,
            "timeout_pytest": as_int(action_test_raw.get("timeout_pytest"), 10),
            "timeout_smoke": as_int(action_test_raw.get("timeout_smoke"), 5),
        }

        compact_cfg = json.dumps(cfg, separators=(",", ":"))
        compact_cloudflare = json.dumps(cloudflare, separators=(",", ":"))
        compact_sync = json.dumps(sync, separators=(",", ":"))
        compact_action_test = json.dumps(action_test, separators=(",", ":"))

        cloudflare_enabled = stages.get("cloudflare_pages") is True or bool(cloudflare_raw.get("project_name"))
        stage_flags = {
            "docker": stages.get("docker") is True,
            "balena": stages.get("balena") is True,
            "github_release": stages.get("github_release") is True,
            "cloudflare_pages": cloudflare_enabled,
            "managed_files_sync": bool(sync_services),
        }
        enabled_stages = ", ".join([key for key, value in stage_flags.items() if value]) or "(none)"
        cf_site = (cloudflare_raw.get("site_url") or "").strip() or "(unset)"
        cf_project = (cloudflare_raw.get("project_name") or "").strip() or "(unset)"
        cf_env = (cloudflare_raw.get("deployment_environment") or "").strip() or "(unset)"
        sync_mode = (sync_raw.get("mode") or "commit") if isinstance(sync_raw.get("mode"), str) else "commit"
        sync_services_text = ", ".join(sync_services) if sync_services else "(none)"
        upstream_source = (upstream.get("source") or "").strip() or "(unset)"
        release_template_path = (release.get("template_path") or "").strip() or "(unset)"

        summary_lines = [
            "## Universal config snapshot",
            "",
            "| Field | Value |",
            "| --- | --- |",
            f"| Enabled stages | `{enabled_stages}` |",
            f"| Upstream source | `{upstream_source}` |",
            f"| Cloudflare project | `{cf_project}` |",
            f"| Cloudflare environment | `{cf_env}` |",
            f"| Cloudflare site URL | `{cf_site}` |",
            f"| Sync mode | `{sync_mode}` |",
            f"| Sync services | `{sync_services_text}` |",
            f"| Release template path | `{release_template_path}` |",
        ]

        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write("\n".join(summary_lines) + "\n")

        print("Universal config snapshot:")
        print(f"  enabled_stages: {enabled_stages}")
        print(f"  upstream_source: {upstream_source}")
        print(f"  cloudflare_project: {cf_project}")
        print(f"  cloudflare_environment: {cf_env}")
        print(f"  cloudflare_site_url: {cf_site}")
        print(f"  sync_mode: {sync_mode}")
        print(f"  sync_services: {sync_services_text}")

        with open(output_path, "a", encoding="utf-8") as handle:
            handle.write("cfg<<__BOS_EOF__\n")
            handle.write(compact_cfg + "\n")
            handle.write("__BOS_EOF__\n")
            handle.write(f"cloudflare={compact_cloudflare}\n")
            handle.write(f"sync={compact_sync}\n")
            handle.write(f"action_test={compact_action_test}\n")
        PY
