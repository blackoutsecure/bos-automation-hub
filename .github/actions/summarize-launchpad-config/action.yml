name: Summarize launchpad config
description: Emit a launchpad config snapshot table to GITHUB_STEP_SUMMARY and logs.

inputs:
  cfg_json:
    description: Compact JSON object from read-launchpad-config.
    required: true

runs:
  using: composite
  steps:
    - name: Summarize config
      shell: bash
      env:
        CFG_JSON: ${{ inputs.cfg_json }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os

        cfg = json.loads(os.environ.get("CFG_JSON") or "{}")
        if not isinstance(cfg, dict):
            cfg = {}

        stages = cfg.get("stages") if isinstance(cfg.get("stages"), dict) else {}
        upstream = cfg.get("upstream") if isinstance(cfg.get("upstream"), dict) else {}
        release = cfg.get("release") if isinstance(cfg.get("release"), dict) else {}
        cloudflare = cfg.get("cloudflare") if isinstance(cfg.get("cloudflare"), dict) else {}
        sync = cfg.get("sync_files") if isinstance(cfg.get("sync_files"), dict) else {}

        cloudflare_enabled = stages.get("cloudflare_pages") is True or bool(cloudflare.get("project_name"))
        services = sync.get("services") if isinstance(sync.get("services"), list) else []
        sync_enabled = any(isinstance(s, str) and s.strip() for s in services)
        sync_services = [s.strip() for s in services if isinstance(s, str) and s.strip()]

        stage_flags = {
            "docker": stages.get("docker") is True,
            "balena": stages.get("balena") is True,
            "github_release": stages.get("github_release") is True,
            "cloudflare_pages": cloudflare_enabled,
            "sync_managed_files": sync_enabled,
        }
        enabled_stages = ", ".join([k for k, v in stage_flags.items() if v]) or "(none)"

        cf_site = (cloudflare.get("site_url") or "").strip() or "(unset)"
        cf_project = (cloudflare.get("project_name") or "").strip() or "(unset)"
        cf_env = (cloudflare.get("deployment_environment") or "").strip() or "(unset)"
        sync_mode = (sync.get("mode") or "commit") if isinstance(sync.get("mode"), str) else "commit"
        sync_services_text = ", ".join(sync_services) if sync_services else "(none)"
        upstream_source = (upstream.get("source") or "").strip() or "(unset)"
        release_template_path = (release.get("template_path") or "").strip() or "(unset)"

        lines = [
            "## Launchpad config snapshot",
            "",
            "| Field | Value |",
            "| --- | --- |",
            f"| Enabled stages | `{enabled_stages}` |",
            f"| Upstream source | `{upstream_source}` |",
            f"| Cloudflare project | `{cf_project}` |",
            f"| Cloudflare environment | `{cf_env}` |",
            f"| Cloudflare site URL | `{cf_site}` |",
            f"| Sync mode | `{sync_mode}` |",
            f"| Sync services | `{sync_services_text}` |",
            f"| Release template path | `{release_template_path}` |",
        ]

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as f:
                f.write("\n".join(lines) + "\n")

        print("Launchpad config snapshot:")
        print(f"  enabled_stages: {enabled_stages}")
        print(f"  upstream_source: {upstream_source}")
        print(f"  cloudflare_project: {cf_project}")
        print(f"  cloudflare_environment: {cf_env}")
        print(f"  cloudflare_site_url: {cf_site}")
        print(f"  sync_mode: {sync_mode}")
        print(f"  sync_services: {sync_services_text}")
        PY
