name: Universal gatekeeper config
author: Blackout Secure
description: >-
  Combined parse-config step for the universal gatekeeper kicker — loads
  `.github/bos-universal-config.json` (via the shared `universal-config`
  action) and resolves the dev/main hub runtime ref (via the shared
  `resolve-hub-ref` action) in a single call, so the kicker's parse-config
  job only needs one step instead of wiring both actions by hand.

inputs:
  config_path:
    description: Path to the config JSON file.
    required: false
    default: .github/bos-universal-config.json
  allow_missing:
    description: Emit {} when config file is missing instead of failing.
    required: false
    default: 'false'
  require_marketplace_enabled:
    description: Fail unless `marketplace.enabled` is `true` in the parsed config.
    required: false
    default: 'false'
  event_name:
    description: github.event_name from the caller.
    required: true
  base_ref:
    description: github.base_ref from pull request events.
    required: false
    default: ''
  merge_group_base_ref:
    description: github.event.merge_group.base_ref from merge-group events.
    required: false
    default: ''
  ref_name:
    description: github.ref_name from the caller.
    required: true

outputs:
  cfg:
    description: Compact JSON object for downstream fromJson usage.
    value: ${{ steps.config.outputs.cfg }}
  cloudflare:
    description: Normalized Cloudflare block derived from the config.
    value: ${{ steps.config.outputs.cloudflare }}
  action_test:
    description: Normalized action_test block derived from the config.
    value: ${{ steps.config.outputs.action_test }}
  organization:
    description: Normalized organization block (runners, reporting, per-workflow overrides).
    value: ${{ steps.config.outputs.organization }}
  target_ref:
    description: Resolved dev or main hub runtime ref for the current event.
    value: ${{ steps.target_ref.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Load universal config
      id: config
      uses: blackoutsecure/bos-automation-hub/.github/actions/universal-config@main
      with:
        config_path: ${{ inputs.config_path }}
        allow_missing: ${{ inputs.allow_missing }}
        require_marketplace_enabled: ${{ inputs.require_marketplace_enabled }}
    - name: Checkout hub resolver
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: blackoutsecure/bos-automation-hub
        ref: ${{ inputs.ref_name == 'dev' && 'dev' || 'main' }}
        path: gatekeeper-hub-runtime
        sparse-checkout: .github/actions/resolve-hub-ref
        sparse-checkout-cone-mode: false
    - name: Resolve target hub ref
      id: target_ref
      uses: ./gatekeeper-hub-runtime/.github/actions/resolve-hub-ref
      with:
        event_name: ${{ inputs.event_name }}
        base_ref: ${{ inputs.base_ref }}
        merge_group_base_ref: ${{ inputs.merge_group_base_ref }}
        ref_name: ${{ inputs.ref_name }}
