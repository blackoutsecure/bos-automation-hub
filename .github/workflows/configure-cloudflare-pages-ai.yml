name: Configure Cloudflare Pages Workers AI bindings (reusable)

# Idempotently attaches one or more Workers AI bindings to an EXISTING
# Cloudflare Pages project via the Cloudflare REST API. This is a
# companion to `deploy-cloudflare-pages.yml`: the deploy reusable ships
# the Pages Function *code* (which reads `env.AI`), while this reusable
# attaches the runtime `AI` *binding* the Function needs. A Workers AI
# binding is an account-level resource attached to the Pages project —
# it does NOT live in any repo and is NOT set by `wrangler pages
# deploy`, so it has to be reconciled out-of-band, once.
#
# Design notes:
#   * Idempotent — re-running re-asserts the same state. Existing
#     bindings of other kinds (env vars, KV, D1, R2) are preserved: the
#     PATCH sends ONLY `deployment_configs.<env>.ai_bindings`, and that
#     map is merged with whatever AI bindings already exist, so nothing
#     else in the project config is touched.
#   * Read-only by default for the repo — no checkout, no contents
#     write. The only side effect is the Cloudflare project mutation.
#   * `dry_run` performs the GET + diff and prints the plan WITHOUT
#     PATCHing, so callers can preview safely.
#
# Token scope: `CLOUDFLARE_API_TOKEN` must carry `Account → Cloudflare
# Pages → Edit` (the same scope the deploy reusable needs). Attaching a
# Workers AI binding does not require a separate Workers AI permission —
# Pages:Edit is sufficient to write the binding reference. Prefer a
# dedicated token (e.g. surfaced via a repo secret named
# `CLOUDFLARE_PAGES_ADMIN_TOKEN`) mapped into this input by the caller,
# so the deploy token can stay scoped to exactly what deploys need.

"on":
  workflow_call:
    inputs:
      cloudflare_project_name:
        description: 'Cloudflare Pages project name (lowercase letters, digits, hyphens; 1–58 chars).'
        required: true
        type: string
      ai_bindings:
        description: >-
          JSON array of Workers AI binding variable names to attach
          (e.g. `["AI"]`). Each name must be a valid binding
          identifier: a letter or underscore followed by letters,
          digits, or underscores. The binding value is always the
          empty Workers AI reference `{}` — Cloudflare resolves it to
          the account's Workers AI at runtime.
        required: false
        type: string
        default: '["AI"]'
      environment:
        description: >-
          Which Pages deployment environment(s) to configure:
          `production`, `preview`, or `both`.
        required: false
        type: string
        default: 'production'
      dry_run:
        description: >-
          When `true`, compute and print the change plan but do NOT
          PATCH the project. Useful for previewing before applying.
        required: false
        type: boolean
        default: false
      runs_on:
        description: >-
          Optional runner override. When empty (default), resolves from
          the org-shared `vars.DEFAULT_RUNNER`. Accepts a bare label or
          a JSON-array string of labels; both shapes are parsed via
          `fromJSON` at runtime. Validated by the
          `preflight-runner-config` job.
        required: false
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: >-
          Cloudflare API token with `Account → Cloudflare Pages → Edit`
          on the account owning the Pages project. Prefer a dedicated
          token rather than reusing the deploy token, to keep each
          least-privilege.
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: >-
          **Back-compat input. Prefer `vars.CLOUDFLARE_ACCOUNT_ID`** —
          account IDs are public Cloudflare identifiers, not secrets.
          When neither this secret nor the var is set, the workflow
          auto-resolves the account via `GET /accounts` against
          `CLOUDFLARE_API_TOKEN` (unambiguous for a single-account
          token).
        required: false
    outputs:
      changed:
        description: '`true` when at least one environment was modified (always `false` on dry_run).'
        value: ${{ jobs.configure.outputs.changed }}
      account_id:
        description: 'Resolved Cloudflare account ID.'
        value: ${{ jobs.configure.outputs.account_id }}

permissions:
  contents: read

concurrency:
  # Serialise per project so two reconciles never race on the same
  # project config. Never cancel an in-flight reconcile.
  group: cf-pages-ai-${{ github.workflow }}-${{ inputs.cloudflare_project_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.DEFAULT_RUNNER` once before the configure
  # job evaluates its `runs-on:` expression. Mirrors deploy-cloudflare-pages.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          default_runner: ${{ vars.DEFAULT_RUNNER }}
          runner_x64: ${{ vars.RUNNER_X64 }}
          runner_arm64: ${{ vars.RUNNER_ARM64 }}

  configure:
    name: Configure Workers AI bindings
    needs: preflight-runner-config
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on || vars.DEFAULT_RUNNER, '[') && (inputs.runs_on || vars.DEFAULT_RUNNER) || format('"{0}"', inputs.runs_on || vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 10
    env:
      PROJECT_NAME: ${{ inputs.cloudflare_project_name }}
      AI_BINDINGS: ${{ inputs.ai_bindings }}
      TARGET_ENV: ${{ inputs.environment }}
      DRY_RUN: ${{ inputs.dry_run }}
      # Public identifier: prefer var (no runner masking, flows through
      # GITHUB_OUTPUT), fall back to back-compat secret.
      ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
      account_id: ${{ steps.account.outputs.value }}
    steps:
      # Validate inputs early — before any API call — so misconfigured
      # callers fail fast with a clear message.
      - name: Preflight validation
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ERR=0
          fail() { echo "ERROR: $*" >&2; ERR=1; }

          # Cloudflare Pages project names: lowercase a-z, 0-9 and '-',
          # 1-58 chars, can't start or end with '-'.
          if ! printf '%s' "${PROJECT_NAME}" \
            | grep -Eq '^[a-z0-9]([a-z0-9-]{0,56}[a-z0-9])?$'; then
            fail "input 'cloudflare_project_name' is not a valid Pages project name: '${PROJECT_NAME}'"
          fi

          case "${TARGET_ENV}" in
            production|preview|both) : ;;
            *) fail "input 'environment' must be 'production', 'preview', or 'both' (got '${TARGET_ENV}')" ;;
          esac

          # A stray newline in the token silently truncates GITHUB_OUTPUT
          # for downstream steps, so reject whitespace explicitly.
          if [ -z "${API_TOKEN}" ]; then
            fail "secret 'CLOUDFLARE_API_TOKEN' is missing"
          else
            case "${API_TOKEN}" in
              *[$'\n\r\t ']*) fail "secret 'CLOUDFLARE_API_TOKEN' contains whitespace/newlines" ;;
            esac
          fi

          # ai_bindings must be a JSON array of valid binding identifiers.
          python3 - <<'PY' || ERR=1
          import json, os, re, sys
          raw = os.environ.get("AI_BINDINGS", "")
          try:
              names = json.loads(raw)
          except Exception as exc:
              print(f"ERROR: input 'ai_bindings' is not valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)
          if not isinstance(names, list) or not names:
              print("ERROR: input 'ai_bindings' must be a non-empty JSON array of strings", file=sys.stderr)
              sys.exit(1)
          ident = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")
          bad = [n for n in names if not (isinstance(n, str) and ident.match(n))]
          if bad:
              print(f"ERROR: invalid binding name(s) in 'ai_bindings': {bad!r}", file=sys.stderr)
              sys.exit(1)
          PY

          [ "${ERR}" -eq 0 ] || exit 1
          echo "Inputs valid."

      # Auto-resolve the account ID when not supplied explicitly — same
      # approach as deploy-cloudflare-pages.yml. A Pages:Edit token maps
      # to exactly one account, so the lookup is unambiguous.
      - name: Auto-resolve Cloudflare account ID
        id: account_autoresolve
        if: env.ACCOUNT_ID == ''
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request

          token = (os.environ.get("API_TOKEN") or "").strip()
          if not token:
              sys.exit("ERROR: CLOUDFLARE_API_TOKEN is required for account auto-resolve")

          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "bos-automation-hub/configure-cloudflare-pages-ai",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  status, payload = resp.status, json.loads(resp.read() or b"{}")
          except urllib.error.HTTPError as exc:
              status = exc.code
              payload = json.loads(exc.read() or b"{}") if exc.headers.get("Content-Type", "").startswith("application/json") else {}

          if status != 200 or not payload.get("success"):
              print(f"ERROR: Cloudflare /accounts returned HTTP {status}", file=sys.stderr)
              print(json.dumps(payload)[:600], file=sys.stderr)
              sys.exit(1)

          result = payload.get("result") or []
          if not result:
              sys.exit("ERROR: token returned zero accounts (no account-scoped permissions).")
          if len(result) > 1:
              names = ", ".join(a.get("name", "?") for a in result)
              sys.exit(
                  f"ERROR: token can access {len(result)} accounts; set vars.CLOUDFLARE_ACCOUNT_ID "
                  f"explicitly to pick one. Accounts: {names}"
              )

          acct_id = (result[0].get("id") or "").strip()
          if not re.match(r"^[0-9a-f]{32}$", acct_id):
              sys.exit(f"ERROR: parsed account ID is not 32-char hex: {acct_id!r}")

          print(f"Auto-resolved Cloudflare account ID: {acct_id}", file=sys.stderr)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"value={acct_id}\n")
          PY

      - name: Resolve & validate Cloudflare account ID
        id: account
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/cloudflare-resolve-id@main
        with:
          value: ${{ env.ACCOUNT_ID || steps.account_autoresolve.outputs.value }}
          kind: account

      # Reconcile the AI bindings. GET current config per env, merge in
      # the requested binding names (preserving any existing AI bindings),
      # and PATCH only `ai_bindings` so nothing else is disturbed.
      - name: Apply AI bindings
        id: apply
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          API = "https://api.cloudflare.com/client/v4"
          token = (os.environ["API_TOKEN"] or "").strip()
          account = os.environ["ACCOUNT_ID"].strip()
          project = os.environ["PROJECT_NAME"].strip()
          dry_run = os.environ.get("DRY_RUN", "false").strip().lower() == "true"
          names = json.loads(os.environ["AI_BINDINGS"])
          target = os.environ["TARGET_ENV"].strip()
          envs = ["production", "preview"] if target == "both" else [target]

          base_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "User-Agent": "bos-automation-hub/configure-cloudflare-pages-ai",
          }

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              headers = dict(base_headers)
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{API}{path}", data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as exc:
                  ct = exc.headers.get("Content-Type", "")
                  payload = json.loads(exc.read() or b"{}") if ct.startswith("application/json") else {}
                  return exc.code, payload

          # Fetch the project once; reuse its deployment_configs for each env.
          status, payload = call("GET", f"/accounts/{account}/pages/projects/{project}")
          if status != 200 or not payload.get("success"):
              print(f"ERROR: GET project '{project}' returned HTTP {status}", file=sys.stderr)
              print(json.dumps(payload)[:800], file=sys.stderr)
              sys.exit(1)

          configs = (payload.get("result") or {}).get("deployment_configs") or {}
          changed_any = False
          summary_rows = []

          for env_name in envs:
              existing = ((configs.get(env_name) or {}).get("ai_bindings")) or {}
              desired = dict(existing)
              for n in names:
                  # Preserve any existing per-binding object; new bindings
                  # get the empty Workers AI reference.
                  desired.setdefault(n, {})

              added = [n for n in names if n not in existing]
              if desired == existing:
                  summary_rows.append((env_name, "unchanged", ", ".join(sorted(existing)) or "—"))
                  print(f"[{env_name}] already has: {sorted(existing)} — no change")
                  continue

              if dry_run:
                  changed_any = False
                  summary_rows.append((env_name, "would-add", ", ".join(sorted(added))))
                  print(f"[{env_name}] DRY RUN — would add: {sorted(added)}")
                  continue

              # PATCH only ai_bindings for this env. Cloudflare merges at
              # the field level, leaving env_vars / kv / d1 / r2 intact.
              body = {"deployment_configs": {env_name: {"ai_bindings": desired}}}
              pstatus, ppayload = call("PATCH", f"/accounts/{account}/pages/projects/{project}", body)
              if pstatus not in (200, 201) or not ppayload.get("success"):
                  print(f"ERROR: PATCH [{env_name}] returned HTTP {pstatus}", file=sys.stderr)
                  print(json.dumps(ppayload)[:800], file=sys.stderr)
                  sys.exit(1)

              # Verify the binding is present in the returned config.
              new_cfg = ((ppayload.get("result") or {}).get("deployment_configs") or {})
              present = set(((new_cfg.get(env_name) or {}).get("ai_bindings")) or {})
              missing = [n for n in names if n not in present]
              if missing:
                  print(f"ERROR: PATCH [{env_name}] succeeded but bindings still missing: {missing}", file=sys.stderr)
                  sys.exit(1)

              changed_any = True
              summary_rows.append((env_name, "added", ", ".join(sorted(added))))
              print(f"[{env_name}] attached: {sorted(added)}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"changed={'true' if changed_any else 'false'}\n")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write("## Cloudflare Pages — Workers AI bindings\n\n")
                  f.write(f"Project: `{project}`  •  Account: `{account}`")
                  f.write("  •  **dry run**\n\n" if dry_run else "\n\n")
                  f.write("| Environment | Result | Bindings |\n")
                  f.write("|-------------|--------|----------|\n")
                  for env_name, result, binds in summary_rows:
                      f.write(f"| {env_name} | {result} | {binds or '—'} |\n")
          PY
