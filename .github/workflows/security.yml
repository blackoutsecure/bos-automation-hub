# Hub-local caller: validate current bos-gate source before promotion.
name: Security

"on":
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parse-config:
    name: Parse launchpad config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cfg: ${{ steps.config.outputs.cfg }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load launchpad config
        id: config
        uses: ./.github/actions/shared/launchpad-config

  security:
    name: security
    needs: parse-config
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/bos-gate.yml
    with:
      enable_lint:                 ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_lint != false }}
      enable_node_lint:            ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_node_lint == true }}
      node_version:                ${{ fromJson(needs.parse-config.outputs.cfg).gate.node_version || '20' }}
      enable_python_lint:          ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_python_lint == true }}
      python_version:              ${{ fromJson(needs.parse-config.outputs.cfg).gate.python_version || '3.11' }}
      enable_shell_lint:           ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_shell_lint == true }}
      enable_dependency_review:    ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_dependency_review != false }}
      enable_code_scan:            ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_code_scan != false }}
      enable_pinned_actions_check: ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_pinned_actions_check != false }}
      enable_pr_title_check:       ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_pr_title_check != false }}
      pr_title_types:              ${{ fromJson(needs.parse-config.outputs.cfg).gate.pr_title_types || 'feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert' }}
      enable_readme_header_check:  ${{ fromJson(needs.parse-config.outputs.cfg).gate.enable_readme_header_check != false }}
      readme_header_profile:       ${{ fromJson(needs.parse-config.outputs.cfg).gate.readme_header_profile || 'generic' }}
    secrets:
      scanning_pat: ${{ secrets.SCANNING_PAT }}