# Hub-local managed-file synchronization.
# Services and commit behavior are configured in bos-launchpad-config.json.
name: Sync managed files (config)

"on":
  schedule:
    - cron: '11 14 * * 1'
  push:
    paths:
      - bos-launchpad-config.json
      - bos-managed-files.yaml
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode.
        type: choice
        options: [commit, check]
        default: commit

permissions:
  contents: read

concurrency:
  group: sync-managed-files-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  parse-config:
    name: Parse launchpad config
    if: >-
      ${{
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sync: ${{ steps.config.outputs.sync }}
      mode: ${{ inputs.mode || fromJson(steps.config.outputs.sync).mode || 'commit' }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load launchpad config
        id: config
        uses: ./.github/actions/shared/launchpad-config

  sync:
    name: Sync managed files
    needs: parse-config
    if: ${{ fromJson(needs.parse-config.outputs.sync).enabled == true }}
    runs-on: ${{ fromJson(needs.parse-config.outputs.sync).runs_on }}
    timeout-minutes: ${{ fromJson(needs.parse-config.outputs.sync).timeout_minutes }}
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Sync configured services
        id: sync
        uses: ./.github/actions/sync-managed-files
        with:
          services: ${{ join(fromJson(needs.parse-config.outputs.sync).services, ' ') }}
          fail_on_drift: ${{ needs.parse-config.outputs.mode == 'check' }}

      - name: Commit and push
        if: >-
          ${{
            needs.parse-config.outputs.mode == 'commit'
            && steps.sync.outputs.changed == 'true'
          }}
        uses: ./.github/actions/shared/commit-and-push
        with:
          files: ${{ steps.sync.outputs.changed_files }}
          message: ${{ fromJson(needs.parse-config.outputs.sync).commit_message }}
          git_user_name: ${{ fromJson(needs.parse-config.outputs.sync).git_user_name }}
          git_user_email: ${{ fromJson(needs.parse-config.outputs.sync).git_user_email }}
          push_retries: ${{ fromJson(needs.parse-config.outputs.sync).push_retries }}
          branch: ${{ github.event.repository.default_branch }}