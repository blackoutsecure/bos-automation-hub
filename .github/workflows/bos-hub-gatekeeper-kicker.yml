name: '[KICKER] Blackout Secure Hub Launchpad'
run-name: >-
  Hub Launchpad / ${{ inputs.scope || 'recommended' }} / ${{
    github.event_name == 'schedule' && 'scheduled' ||
    github.event_name == 'workflow_dispatch' && 'manual' ||
    'config or runtime change'
  }}

"on":
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main, dev]
    paths:
      - '.github/bos-universal-config.json'
      - '.github/actions/**'
      - '.github/workflows/bos-universal-launchpad.yml'
      - '.github/workflows/repo-metadata-sync.yml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      scope:
        description: Run the recommended hub maintenance, security only, or metadata only.
        type: choice
        options: [recommended, security, metadata]
        default: recommended

permissions:
  contents: read
  actions: write
  pull-requests: write
  security-events: write
  models: read

concurrency:
  group: bos-hub-launchpad-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launchpad:
    name: Run hub Launchpad
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message || '', '[hub-launchpad]')
    permissions:
      contents: write
      actions: write
      pull-requests: write
      security-events: write
      models: read
    uses: ./.github/workflows/bos-universal-launchpad.yml
    with:
      enable_security_scan: ${{ inputs.scope != 'metadata' }}
      enable_repo_metadata: ${{ inputs.scope != 'security' }}
      repo_metadata_homepage: https://github.com/blackoutsecure/bos-automation-hub
      repo_metadata_topics: github-actions automation reusable-workflows composite-actions devops ci-cd workflow-automation
      repo_metadata_generate_topics: true
      repo_metadata_ai_enabled: true
      repo_metadata_ai_model: auto
      repo_metadata_show_releases: true
      repo_metadata_show_deployments: false
      repo_metadata_show_packages: false
      repo_metadata_dry_run: false
    secrets: inherit
