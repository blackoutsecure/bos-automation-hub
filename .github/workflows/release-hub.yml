# Hub-internal release: promote the default branch to `main` (runtime allowlist)
# + tag + publish GitHub Release.
#
# This is the hub's OWN release workflow. It is NOT the same shape as
# the Marketplace Action repos' release-promote.yml because the hub is not a
# Marketplace Action — its consumer surface IS reusable workflows
# under `.github/workflows/`, which the hub's published
# `release-promote.yml` workflow hard-blocks from any allowlist.
#
# Model:
#   * The repository default branch is the working source (`dev` today).
#   * `main` is the promoted / stable branch consumers ref via
#     `blackoutsecure/bos-automation-hub/.github/{workflows,actions}/X@main`
#     (and via `@vX.Y.Z` / `@vX` SemVer pins).
#   * Promotion replaces `main`'s tree with a runtime allowlist derived
#     from the default branch: shared actions, managed templates, core docs/license,
#     and workflows declaring `workflow_call`. Event-only workflows and
#     maintainer tooling do NOT ship to main. The promote commit's parent is the
#     previous `main` HEAD, so `main`'s history stays linear and
#     downstream consumers see a normal fast-forward push.
#
# Pipeline:
#   1. preflight-runner-config — validate `vars.DEFAULT_RUNNER` once
#                                so downstream `runs-on:` expressions
#                                don't queue against a missing label.
#   2. compute-tag             — resolve `tag_name` from explicit
#                                input OR `bump` mode (default
#                                `patch`). Refuse if both are given
#                                or the tag already exists.
#   3. promote                 — materialize `main`'s next tree in a
#                                worktree (default-branch runtime allowlist),
#                                commit on top of current `main`,
#                                atomic-push the new commit + tag,
#                                optionally move the floating major
#                                tag (`vX`). No-op when the curated
#                                tree already matches `main` (tag-only).
#   4. release                 — chain to `github-release.yml` to
#                                publish the GitHub Release.
#
# Trigger: `workflow_dispatch` ONLY. This workflow file is itself in
# the runtime allowlist, so it lives ONLY on the development branch.
#
# Token model: prefers `secrets.RELEASE_PAT` for the push + tag
# (admin role / bypass for protected `main`). Falls back to
# `GITHUB_TOKEN` when no PAT is wired — in which case `main`'s
# branch protection must allow GitHub Actions to push.
name: Hub runtime release · promote default branch → main

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Explicit tag to create on `main` (SemVer, e.g. `v0.2.0`).
          Leave empty to auto-compute via `bump`.
        required: false
        type: string
        default: ''
      bump:
        description: >-
          Auto-compute the next tag from the latest `vX.Y.Z`. Ignored
          when `tag_name` is non-empty. Default `patch` so dispatch
          with no inputs ships the next patch release.
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - none
      update_major_tag:
        description: >-
          Move (force-push) the floating major tag (e.g. `v0`) to
          the new release. Standard convention for `@vX` pins.
        required: false
        type: boolean
        default: true
      dry_run:
        description: >-
          Validate inputs + show the FF target SHA but do NOT push
          to `main`, create the tag, or publish the release.
        required: false
        type: boolean
        default: false
      release_draft:
        description: 'Create the GitHub Release as draft.'
        required: false
        type: boolean
        default: false
      previous_tag:
        description: >-
          Previous release tag for the changelog seed (e.g. `v0.1.2`).
          Forwarded to `github-release.yml`. Empty disables changelog.
        required: false
        type: string
        default: ''
      ai_changelog:
        description: >-
          `'true'` to summarize the commit log via GitHub Models.
          Falls back to deterministic grouping on any AI failure.
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

# One release at a time, globally. `tag_name` can be empty when
# `bump` is used, so group on the workflow name instead.
concurrency:
  group: release-hub-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.DEFAULT_RUNNER` once before any downstream
  # job evaluates its `runs-on:` expression. See `github-release.yml` for
  # the full rationale; this mirrors the org-wide convention.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Local-path `uses: ./...` requires the calling workflow to
      # have checked out the repo first. The shared composite is
      # tiny and pure-bash, so no extra setup is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/shared/preflight-runner-config
        with:
          default_runner: ${{ vars.DEFAULT_RUNNER }}

  compute-tag:
    name: Compute release tag
    needs: preflight-runner-config
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.compute.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full tag history to find the latest vX.Y.Z.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: compute
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_BUMP:     ${{ inputs.bump }}
        run: |
          set -euo pipefail

          TAG="$(printf '%s' "${INPUT_TAG_NAME}" | tr -d '[:space:]')"
          BUMP="${INPUT_BUMP:-none}"

          if [ -z "${TAG}" ] && [ "${BUMP}" = "none" ]; then
            echo "::error::Either tag_name or bump (patch/minor/major) must be provided."
            exit 1
          fi

          if [ -n "${TAG}" ]; then
            BUMP="none"
            echo "Using explicit tag_name: ${TAG}"
          else
            git fetch --tags --quiet || true
            LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1 || true)"
            if [ -z "${LATEST}" ]; then
              LATEST="v0.0.0"
              echo "No prior tags; seeding from v0.0.0."
            else
              echo "Latest tag: ${LATEST}"
            fi
            VERSION="${LATEST#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            case "${BUMP}" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *)     echo "::error::Unknown bump mode '${BUMP}'."; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Computed tag (bump=${BUMP}): ${TAG}"
          fi

          # SemVer hard-validate (matches the kit's promote composite).
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not SemVer (vX.Y.Z[-suffix])."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Pick a fresh tag."
            exit 1
          fi

          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Tag resolution"
            echo ""
            echo "| Field    | Value |"
            echo "|----------|-------|"
            echo "| tag_name | \`${TAG}\` |"
            echo "| bump     | \`${BUMP}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote default branch → main (runtime allowlist)
    needs: [preflight-runner-config, compute-tag]
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    permissions:
      # `contents: write` for the push to `main` + tag push (used
      # when falling back to GITHUB_TOKEN with no RELEASE_PAT wired).
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      target_sha: ${{ steps.promote.outputs.target_sha }}
      promoted:   ${{ steps.promote.outputs.promoted }}
    steps:
      - id: token
        env:
          HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' && 'true' || 'false' }}
        run: |
          if [ "${HAS_RELEASE_PAT}" = "true" ]; then
            echo "kind=pat" >> "${GITHUB_OUTPUT}"
            echo "Using secrets.RELEASE_PAT for push + tag."
          else
            echo "kind=github_token" >> "${GITHUB_OUTPUT}"
            echo "Using GITHUB_TOKEN for push + tag. Ensure main's branch protection allows GitHub Actions to push."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the development/default source branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.kind == 'pat' && secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # Persist creds so subsequent `git push` reuses the resolved token.
          persist-credentials: true
      - id: promote
        env:
          TAG_NAME:         ${{ needs.compute-tag.outputs.tag_name }}
          UPDATE_MAJOR_TAG: ${{ inputs.update_major_tag }}
          DRY_RUN:          ${{ inputs.dry_run }}
          SOURCE_BRANCH:    ${{ github.event.repository.default_branch }}
          TARGET_BRANCH:    main
        run: |
          set -euo pipefail

          if [[ "${SOURCE_BRANCH}" == "${TARGET_BRANCH}" ]]; then
            echo "::error::Source and target branches must differ (${SOURCE_BRANCH})."
            exit 1
          fi

          git fetch origin "${SOURCE_BRANCH}" "${TARGET_BRANCH}" --tags --quiet || \
            git fetch origin "${SOURCE_BRANCH}" --tags --quiet

          SOURCE_SHA="$(git rev-parse "origin/${SOURCE_BRANCH}")"
          if git rev-parse --verify --quiet "origin/${TARGET_BRANCH}" >/dev/null; then
            TARGET_EXISTS=true
            TARGET_PARENT="$(git rev-parse "origin/${TARGET_BRANCH}")"
          else
            TARGET_EXISTS=false
            TARGET_PARENT=""
          fi

          echo "source (${SOURCE_BRANCH}): ${SOURCE_SHA}"
          echo "target parent: ${TARGET_PARENT:-(none; main does not exist)}"
          echo "tag:           ${TAG_NAME}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

          MAJOR_TAG=""
          if [ "${UPDATE_MAJOR_TAG}" = "true" ]; then
            # Derive `vX` from `vX.Y.Z[-suffix]`.
            MAJOR_TAG="$(printf '%s' "${TAG_NAME}" | sed -E 's/^(v[0-9]+)\..*/\1/')"
            echo "floating major tag: ${MAJOR_TAG}"
          fi

          PUBLISH_PATHS=(
            .github/actions
            managed-files
            LICENSE
            README.md
          )

          # Every reusable workflow is part of the public runtime surface.
          # Event-only workflows are dev tooling and remain unpublished.
          mapfile -t REUSABLE_WORKFLOWS < <(
            grep -lE '^  workflow_call:' .github/workflows/*.yml | sort
          )
          if (( ${#REUSABLE_WORKFLOWS[@]} == 0 )); then
            echo "::error::No reusable workflows found; refusing to publish an empty runtime."
            exit 1
          fi
          PUBLISH_PATHS+=("${REUSABLE_WORKFLOWS[@]}")

          echo "Publishing runtime paths:"
          printf '  %s\n' "${PUBLISH_PATHS[@]}"

          # --- Materialize the curated `main` tree in a worktree --------
          # Same general shape as bos-marketplace-kit's promote composite:
          # wipe the target tree, bring across only the runtime allowlist,
          # then commit and atomically push the result.
          WORKTREE_DIR="$(mktemp -d -t hub-promote-XXXXXXXX)"
          # shellcheck disable=SC2064
          trap "git worktree remove --force '${WORKTREE_DIR}' 2>/dev/null || true; rm -rf '${WORKTREE_DIR}'" EXIT

          if [ "${TARGET_EXISTS}" = "true" ]; then
            git worktree add --force -B "${TARGET_BRANCH}" "${WORKTREE_DIR}" "refs/remotes/origin/${TARGET_BRANCH}"
          else
            git worktree add --force -B "${TARGET_BRANCH}" "${WORKTREE_DIR}" "${SOURCE_SHA}"
          fi

          (
            cd "${WORKTREE_DIR}"
            # Wipe the staged target tree (handles renames + removed files
            # on the source branch that would otherwise persist on the target).
            if [ -n "$(git ls-files)" ]; then
              git ls-files -z | xargs -0 git rm -f -q --
            fi
            git checkout "${SOURCE_SHA}" -- "${PUBLISH_PATHS[@]}"
            git add -A

            mapfile -t PUBLISHED_WORKFLOWS < <(git ls-files '.github/workflows/*.yml')
            if (( ${#PUBLISHED_WORKFLOWS[@]} != ${#REUSABLE_WORKFLOWS[@]} )); then
              echo "::error::Published workflow count does not match reusable workflow count."
              exit 1
            fi
          )

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the commit subject single-line + scannable. Provenance
          # is in the subject (tag + source SHA); the full denylist
          # rationale lives in `.github/workflows/release-hub.yml` on
          # the source branch so we don't re-explain it on every release.
          COMMIT_MSG="release ${TAG_NAME}: promote ${SOURCE_BRANCH} (${SOURCE_SHA}) to ${TARGET_BRANCH}"

          # --- No-op detection (curated tree already matches main) ------
          # Even when there's nothing to commit, an operator-dispatched
          # release is an explicit intent — tag the existing main HEAD
          # so the GitHub Release still publishes.
          if ( cd "${WORKTREE_DIR}" && git diff --cached --quiet ); then
            TARGET_SHA="$( cd "${WORKTREE_DIR}" && git rev-parse HEAD )"
            echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
            echo "::notice::Curated tree already matches main (${TARGET_SHA}); tag-only promote."
            echo "promoted=false" >> "${GITHUB_OUTPUT}"

            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::dry_run=true — would tag ${TAG_NAME} at ${TARGET_SHA} (no push)."
              {
                echo "## Promote (dry run, tag-only)"
                echo ""
                echo "| Field        | Value |"
                echo "|--------------|-------|"
                echo "| source (${SOURCE_BRANCH}) | \`${SOURCE_SHA}\` |"
                echo "| target_sha   | \`${TARGET_SHA}\` |"
                echo "| tag          | \`${TAG_NAME}\` |"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            (
              cd "${WORKTREE_DIR}"
              git tag -a "${TAG_NAME}" -m "${COMMIT_MSG}" "${TARGET_SHA}"
              git push origin "refs/tags/${TAG_NAME}"
              if [ -n "${MAJOR_TAG}" ]; then
                git tag -f "${MAJOR_TAG}" "${TARGET_SHA}"
                git push --force origin "refs/tags/${MAJOR_TAG}"
              fi
            )
            {
              echo "## Promote (tag-only)"
              echo ""
              echo "| Field        | Value |"
              echo "|--------------|-------|"
              echo "| source (${SOURCE_BRANCH}) | \`${SOURCE_SHA}\` |"
              echo "| target_sha   | \`${TARGET_SHA}\` |"
              echo "| tag          | \`${TAG_NAME}\` |"
              echo "| major_tag    | \`${MAJOR_TAG:-(none)}\` |"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::dry_run=true — staged diff (not committing):"
            ( cd "${WORKTREE_DIR}" && git diff --cached --stat )
            echo "target_sha=${TARGET_PARENT}" >> "${GITHUB_OUTPUT}"
            echo "promoted=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## Promote (dry run)"
              echo ""
              echo "| Field        | Value |"
              echo "|--------------|-------|"
              echo "| source (${SOURCE_BRANCH}) | \`${SOURCE_SHA}\` |"
              echo "| main parent  | \`${TARGET_PARENT:-(new)}\` |"
              echo "| tag          | \`${TAG_NAME}\` |"
              echo ""
              echo '### Staged diff'
              echo ''
              echo '```'
              ( cd "${WORKTREE_DIR}" && git diff --cached --stat )
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # --- Commit + atomic push of (HEAD, tag) ----------------------
          (
            cd "${WORKTREE_DIR}"
            git commit -m "${COMMIT_MSG}"
            git tag -a "${TAG_NAME}" -m "${COMMIT_MSG}"
            git push --atomic origin \
              "HEAD:refs/heads/${TARGET_BRANCH}" \
              "refs/tags/${TAG_NAME}"
          )
          TARGET_SHA="$( cd "${WORKTREE_DIR}" && git rev-parse HEAD )"
          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "promoted=true" >> "${GITHUB_OUTPUT}"

          if [ -n "${MAJOR_TAG}" ]; then
            (
              cd "${WORKTREE_DIR}"
              git tag -f "${MAJOR_TAG}" "${TARGET_SHA}"
              git push --force origin "refs/tags/${MAJOR_TAG}"
            )
          fi

          {
            echo "## Promote"
            echo ""
            echo "| Field        | Value |"
            echo "|--------------|-------|"
            echo "| source (${SOURCE_BRANCH}) | \`${SOURCE_SHA}\` |"
            echo "| main parent  | \`${TARGET_PARENT:-(new)}\` |"
            echo "| main HEAD    | \`${TARGET_SHA}\` |"
            echo "| tag          | \`${TAG_NAME}\` |"
            echo "| major_tag    | \`${MAJOR_TAG:-(none)}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Publish GitHub Release
    needs: [compute-tag, promote]
    # Skip the release publish when the operator chose dry_run.
    if: inputs.dry_run != true
    uses: ./.github/workflows/github-release.yml
    permissions:
      contents: write
      models: read
    with:
      tag_name:       ${{ needs.compute-tag.outputs.tag_name }}
      draft:          ${{ inputs.release_draft }}
      previous_tag:   ${{ inputs.previous_tag }}
      source_branch:  ${{ github.event.repository.default_branch }}
      ai_changelog:   ${{ inputs.ai_changelog }}
      target_commitish: main
