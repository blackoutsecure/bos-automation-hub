#   action; the canonical source lives in
#   `.github/actions/sync-managed-files/sync.py` as the Python string
#   constant _BOS_LAUNCHPAD_RELEASE_YML.
#
# Purpose: shows what the hub writes into a consumer repo's
#   `.github/workflows/bos-launchpad.yml` when the `bos_launchpad`
#   service is enabled in that repo's `bos-managed-files.yaml`. Read this
#   file to understand the kicker contract; do NOT copy it by hand into a
#   consumer repo — the hub will overwrite any hand-authored copy on the
#   next sync (and silently drift from the example here if you do).
#
# Per-repo customization happens in `.bos-launchpad.yaml` at the consumer
# repo root, NOT in this file. See the matching data-file example:
#   * release flavor    → `examples/bos-launchpad-release.example.yaml`
#   * cf-pages flavor   → `examples/bos-launchpad-cf-pages.example.yaml`
#   * sync-files flavor → `examples/bos-launchpad-sync-files.example.yaml`
#   * gate flavor       → `examples/bos-launchpad-gate.example.yaml`
#
# To refresh this snapshot after editing the constant in sync.py:
#   python3 scripts/sync-kicker-examples-from-sync.py
# =============================================================================

# Blackout Secure Launchpad — universal kicker (hub-managed).
#
# Calls `bos-launchpad-release.yml` in blackoutsecure/bos-automation-hub. Reads
# per-repo customization from `bos-launchpad-config.json` at the repo root.
#
# CUSTOMIZE via `bos-launchpad-config.json` — NOT this file. The hub
# overwrites this workflow in place on every sync; hand-edits are
# lost. Schema docs: https://github.com/blackoutsecure/bos-automation-hub
#
# Required vars   (names overridable via `bos-launchpad-config.json`):
#   DOCKERHUB_NAMESPACE, BALENA_NAMESPACE
# Required secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, BALENA_API_TOKEN
#   UPSTREAM_TOKEN (optional — only for private upstream repos)
name: Blackout Secure Launchpad (kicker)
run-name: >-
  Blackout Secure Launchpad / universal / ${{
    github.event_name == 'workflow_dispatch'
      && (inputs.force_run && 'manual force' || 'manual')
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'push'
  }} / ref:${{ github.ref_name }} / cf-env:${{ vars.CLOUDFLARE_DEPLOYMENT_ENV || 'from-bos-launchpad-config.json' }} / cf-domain:${{ vars.CLOUDFLARE_SITE_URL || 'from-bos-launchpad-config.json' }}

on:
  schedule:
    - cron: '17 */6 * * *'   # stagger off :00 to dodge org cron pile-ups
  push:
    branches: [main]
    # Source paths that should trigger the workflow on commit. Whether
    # push events actually FORCE a rebuild is controlled by
    # `triggers.force_on_push` in `bos-launchpad-config.json` (default
    # `false`: a push that doesn't move upstream is a no-op release).
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'root/**'
      - 'build/**'
      - 'scripts/**'
      - '.github/upstream/**'
      - 'bos-launchpad-config.json'
      - 'bos-managed-files.yaml'
      - '.github/workflows/bos-launchpad.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force: run pipeline even if upstream unchanged'
        type: boolean
        default: false
      sync_mode:
        description: 'Sync mode for integrated managed-files stage'
        type: choice
        options: [commit, check]
        default: commit

# No top-level `concurrency:` — the hub workflow owns serialization.
# Declaring it on both sides triggers a GHA self-deadlock.
permissions:
  contents: read

jobs:
  parse-config:
    name: Parse launchpad config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cfg: ${{ steps.read.outputs.cfg }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Convert launchpad config to JSON
        id: read
        shell: bash
        run: |
          set -euo pipefail
          cfg_file='bos-launchpad-config.json'
          if [[ ! -f "$cfg_file" ]]; then
            echo "::error file=$cfg_file::Required config file not found."
            exit 1
          fi
          if ! cfg="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding="utf-8")), separators=(",", ":")))' "$cfg_file")"; then
            echo "::error file=$cfg_file::JSON parse error (see preceding python output)."
            exit 1
          fi
          # Round-trip through python's JSON parser as a sanity check —
          # catches any yq quirk that produces non-conformant JSON.
          if ! echo "$cfg" | python3 -c 'import json,sys; json.loads(sys.stdin.read())' >/dev/null; then
            echo "::error file=$cfg_file::Resulting JSON did not parse — invalid config payload."
            exit 1
          fi
          # Heredoc framing tolerates literal newlines inside string
          # values even though we asked yq for compact JSON.
          {
            echo "cfg<<__BOS_EOF__"
            echo "$cfg"
            echo "__BOS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize launchpad config
        shell: bash
        env:
          CFG_JSON: ${{ steps.read.outputs.cfg }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          cfg = json.loads(os.environ.get("CFG_JSON") or "{}")
          if not isinstance(cfg, dict):
              cfg = {}

          stages = cfg.get("stages") if isinstance(cfg.get("stages"), dict) else {}
          cloudflare = cfg.get("cloudflare") if isinstance(cfg.get("cloudflare"), dict) else {}
          sync = cfg.get("sync_files") if isinstance(cfg.get("sync_files"), dict) else {}
          upstream = cfg.get("upstream") if isinstance(cfg.get("upstream"), dict) else {}

          enabled = [
              name
              for name in ["docker", "balena", "github_release", "companion_docker", "cloudflare_pages"]
              if stages.get(name) is True
          ]
          if cloudflare.get("project_name"):
              enabled.append("cloudflare_pages")
          enabled_stages = ", ".join(sorted(set(enabled))) or "(none)"

          site_url = (cloudflare.get("site_url") or "").strip() or "(unset)"
          project = (cloudflare.get("project_name") or "").strip() or "(unset)"
          env_name = (cloudflare.get("deployment_environment") or "").strip() or "(unset)"
          sync_mode = (sync.get("mode") or "commit") if isinstance(sync.get("mode"), str) else "commit"
          services = sync.get("services") if isinstance(sync.get("services"), list) else []
          services_text = ", ".join([s for s in services if isinstance(s, str) and s.strip()]) or "(none)"
          upstream_source = (upstream.get("source") or "").strip() or "(unset)"

          lines = [
              "## Launchpad config snapshot",
              "",
              "| Field | Value |",
              "| --- | --- |",
              f"| Enabled stages | `{enabled_stages}` |",
              f"| Upstream source | `{upstream_source}` |",
              f"| Cloudflare project | `{project}` |",
              f"| Cloudflare environment | `{env_name}` |",
              f"| Cloudflare site URL | `{site_url}` |",
              f"| Sync mode | `{sync_mode}` |",
              f"| Sync services | `{services_text}` |",
          ]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          print("Launchpad config snapshot:")
          print(f"  enabled_stages: {enabled_stages}")
          print(f"  upstream_source: {upstream_source}")
          print(f"  cloudflare_project: {project}")
          print(f"  cloudflare_environment: {env_name}")
          print(f"  cloudflare_site_url: {site_url}")
          print(f"  sync_mode: {sync_mode}")
          print(f"  sync_services: {services_text}")
          PY

  release:
    name: Release
    needs: parse-config
    permissions:
      contents:        write   # monitor tracking-file commit + GitHub Release publish
      actions:         write   # nested monitor (`gh workflow run`)
      pull-requests:   write   # nested Docker Scout PR annotations
      security-events: write   # nested Docker Scout SARIF upload
      models:          read    # nested release.yml -> github-release.yml AI changelog
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-launchpad-release.yml@main
    with:
      # ----- Monitor stage -----
      upstream_repo:     ${{ fromJson(needs.parse-config.outputs.cfg).upstream.repo || '' }}
      source:            ${{ fromJson(needs.parse-config.outputs.cfg).upstream.source || 'github_release' }}
      upstream_branch:   ${{ fromJson(needs.parse-config.outputs.cfg).upstream.branch || '' }}
      version_file_path: ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_file_path || 'version' }}
      version_regex:     ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_regex || '' }}
      image_ref:         ${{ fromJson(needs.parse-config.outputs.cfg).upstream.image_ref || '' }}
      package_name:      ${{ fromJson(needs.parse-config.outputs.cfg).upstream.package_name || '' }}
      version_url:       ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_url || '' }}
      tag_pattern:       ${{ fromJson(needs.parse-config.outputs.cfg).upstream.tag_pattern || '' }}
      track_file:        ${{ fromJson(needs.parse-config.outputs.cfg).upstream.track_file || '.github/upstream/tracked-release.json' }}
      # Force gating: schedule NEVER forces; push forces only when the
      # data file opts in via `triggers.force_on_push: true`; dispatch
      # honours the operator checkbox.
      force_run: ${{ (github.event_name == 'push' && fromJson(needs.parse-config.outputs.cfg).triggers.force_on_push == true) || (github.event_name == 'workflow_dispatch' && inputs.force_run) }}

      # ----- Stage toggles -----
      docker:           ${{ fromJson(needs.parse-config.outputs.cfg).stages.docker == true }}
      balena:           ${{ fromJson(needs.parse-config.outputs.cfg).stages.balena == true }}
      github_release:   ${{ fromJson(needs.parse-config.outputs.cfg).stages.github_release == true }}
      companion_docker: ${{ fromJson(needs.parse-config.outputs.cfg).stages.companion_docker == true }}

      # ----- Docker stage -----
      image_name:                ${{ fromJson(needs.parse-config.outputs.cfg).docker.image_name || '' }}
      # `vars[<expr>]` does dynamic key lookup against the `vars`
      # context. Default `DOCKERHUB_NAMESPACE` matches the historic
      # caller convention; override via `docker.namespace_var`.
      dockerhub_namespace:       ${{ vars[fromJson(needs.parse-config.outputs.cfg).docker.namespace_var || 'DOCKERHUB_NAMESPACE'] }}
      docker_extra_tags:         ${{ fromJson(needs.parse-config.outputs.cfg).docker.extra_tags || '' }}
      docker_short_description:  ${{ fromJson(needs.parse-config.outputs.cfg).docker.short_description || '' }}
      # `!= false` semantics: missing key → null → null != false → true.
      # Match the launchpad's own default (true) for these flags.
      docker_latest:             ${{ fromJson(needs.parse-config.outputs.cfg).docker.latest != false }}
      docker_multi_arch:         ${{ fromJson(needs.parse-config.outputs.cfg).docker.multi_arch != false }}
      docker_update_description: ${{ fromJson(needs.parse-config.outputs.cfg).docker.update_description != false }}
      docker_force: ${{ (github.event_name == 'push' && fromJson(needs.parse-config.outputs.cfg).triggers.force_on_push == true) || (github.event_name == 'workflow_dispatch' && inputs.force_run) }}

      # ----- Docker Scout -----
      docker_enable_scout:             ${{ fromJson(needs.parse-config.outputs.cfg).scout.enable != false }}
      docker_scout_command:            ${{ fromJson(needs.parse-config.outputs.cfg).scout.command || 'cves' }}
      docker_scout_severities:         ${{ fromJson(needs.parse-config.outputs.cfg).scout.severities || 'critical,high' }}
      docker_scout_only_fixed:         ${{ fromJson(needs.parse-config.outputs.cfg).scout.only_fixed == true }}
      docker_scout_ignore_base:        ${{ fromJson(needs.parse-config.outputs.cfg).scout.ignore_base == true }}
      docker_scout_organization:       ${{ fromJson(needs.parse-config.outputs.cfg).scout.organization || '' }}
      docker_scout_record_environment: ${{ fromJson(needs.parse-config.outputs.cfg).scout.record_environment || '' }}
      docker_scout_sarif_upload:       ${{ fromJson(needs.parse-config.outputs.cfg).scout.sarif_upload != false }}
      docker_scout_exit_code:          ${{ fromJson(needs.parse-config.outputs.cfg).scout.exit_code == true }}
      docker_scout_enable_repo:        ${{ fromJson(needs.parse-config.outputs.cfg).scout.enable_repo != false }}

      # ----- Balena stage -----
      block_name:                 ${{ fromJson(needs.parse-config.outputs.cfg).balena.block_name || '' }}
      balena_namespace:           ${{ vars[fromJson(needs.parse-config.outputs.cfg).balena.namespace_var || 'BALENA_NAMESPACE'] }}
      balena_sync_yml:            ${{ fromJson(needs.parse-config.outputs.cfg).balena.sync_yml != false }}
      balena_draft:               ${{ fromJson(needs.parse-config.outputs.cfg).balena.draft == true }}
      balena_force: ${{ (github.event_name == 'push' && fromJson(needs.parse-config.outputs.cfg).triggers.force_on_push == true) || (github.event_name == 'workflow_dispatch' && inputs.force_run) }}
      balena_generate_yml:        ${{ fromJson(needs.parse-config.outputs.cfg).balena.generate_yml == true }}
      balena_type:                ${{ fromJson(needs.parse-config.outputs.cfg).balena.type || 'sw.block' }}
      balena_repository_url:      ${{ fromJson(needs.parse-config.outputs.cfg).balena.repository_url || '' }}
      balena_logo_url:            ${{ fromJson(needs.parse-config.outputs.cfg).balena.logo_url || '' }}
      balena_default_device_type: ${{ fromJson(needs.parse-config.outputs.cfg).balena.default_device_type || '' }}
      # `|-` chomps the trailing newline that a plain `|` block would
      # add at each forwarding hop, so multi-line caller values stay
      # byte-stable through the kicker → launchpad → release.yml chain.
      balena_description: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.description || '' }}
      balena_post_provisioning: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.post_provisioning || '' }}
      balena_supported_device_types: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.supported_device_types || '' }}

      # ----- Companion Docker stage -----
      companion_image_name:               ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.image_name || '' }}
      companion_build_target:             ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.build_target || '' }}
      companion_docker_short_description: ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.short_description || '' }}

      # ----- GitHub Release stage -----
      release_template_path:  ${{ fromJson(needs.parse-config.outputs.cfg).release.template_path || '' }}
      release_extra_context:  ${{ fromJson(needs.parse-config.outputs.cfg).release.extra_context || '' }}
      generate_release_notes: ${{ fromJson(needs.parse-config.outputs.cfg).release.generate_notes != false }}
      release_files:          ${{ fromJson(needs.parse-config.outputs.cfg).release.files || '' }}
      release_draft:          ${{ fromJson(needs.parse-config.outputs.cfg).release.draft == true }}

      # ----- Shared -----
      platforms: ${{ fromJson(needs.parse-config.outputs.cfg).platforms || 'linux/amd64,linux/arm64' }}

      # ----- Universal kicker wiring -----
      use_launchpad_config: true
      sync_managed_files: true
      sync_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_mode || '' }}

      # ----- Optional stages configured from data file -----
      enable_security_scan:         ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable == true }}
      security_scan_fail_on:        ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.fail_on || 'fail' }}
      security_scan_blocks_release: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.blocks_release != false }}
      security_scan_enable_kit_composite: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_kit_composite != false }}
      security_scan_enable_posture:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_posture != false }}
      security_scan_enable_scanners:      ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_scanners != false }}
      security_scan_enable_upload:        ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_upload != false }}
      security_scan_codeql_languages:     ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_languages || '' }}
      security_scan_codeql_queries:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_queries || 'security-and-quality' }}
      security_scan_codeql_runs_on:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_runs_on || '' }}
      security_scan_use_advanced_pat:     ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.use_advanced_pat == true }}

      enable_repo_metadata:          ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.enable == true }}
      repo_metadata_description:     ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.description || '' }}
      repo_metadata_homepage:        ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.homepage || '' }}
      repo_metadata_topics:          ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics || '' }}
      repo_metadata_generate_topics: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.generate_topics == true }}
      repo_metadata_topics_fallback: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics_fallback || '' }}
      repo_metadata_ai_enabled:      ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_enabled != false }}
      repo_metadata_ai_model:        ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_model || 'openai/gpt-4o-mini' }}
      repo_metadata_show_releases:   ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_releases != false }}
      repo_metadata_show_deployments: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_deployments == true }}
      repo_metadata_show_packages:   ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_packages == true }}
      repo_metadata_dry_run:         ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.dry_run == true }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}
      BALENA_API_TOKEN:   ${{ secrets.BALENA_API_TOKEN }}
      UPSTREAM_TOKEN:     ${{ secrets.UPSTREAM_TOKEN }}
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID:    ${{ secrets.CLOUDFLARE_ZONE_ID }}
      scanning_pat:       ${{ secrets.SCANNING_PAT }}
      REPO_ADMIN_PAT:     ${{ secrets.REPO_ADMIN_PAT }}
