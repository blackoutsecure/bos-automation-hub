# Lint for a Python-based GitHub Action repo. Runs:
#   - actionlint (workflow + composite action YAML)
#   - ruff      (linter; reads pyproject.toml [tool.ruff])
#   - pytest    (unit tests under test/)
#
# This is a starter template — the hub writes it only when missing and
# will never overwrite it. Adjust Python version / extra steps to taste.

name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          matcher: true
          fail-on-error: true
          shellcheck: true

  python-lint:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install ruff pytest
          fi
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: |
          if [ -d test ] || [ -d tests ]; then
            pytest -q
          else
            echo "::notice::no test/ or tests/ directory — skipping pytest"
          fi
