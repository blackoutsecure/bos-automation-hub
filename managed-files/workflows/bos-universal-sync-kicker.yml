# Blackout Secure universal sync kicker (hub-managed).
# Customize via `bos-launchpad-config.json` (repo root), not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: Blackout Secure universal sync (kicker)
run-name: >-
  Blackout Secure universal sync / ${{
    github.event_name == 'workflow_dispatch'
      && format('manual ({0})', inputs.mode)
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'config changed'
  }}

on:
  schedule:
    - cron: '29 14 * * 1'
  push:
    paths:
      - 'bos-launchpad-config.json'
      - 'bos-managed-files.yaml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: commit drift back, or check-only'
        type: choice
        options: [commit, check]
        default: commit

permissions:
  contents: read

jobs:
  parse-config:
    name: Parse sync config
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sync: ${{ steps.config.outputs.sync }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load sync config
        id: config
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/launchpad-config@main

  sync:
    name: Sync managed files
    needs: parse-config
    if: >-
      !cancelled()
      && needs.parse-config.result == 'success'
      && fromJson(needs.parse-config.outputs.sync).enabled == true
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/sync-managed-files.yml@main
    with:
      services: ${{ join(fromJson(needs.parse-config.outputs.sync).services, ' ') }}
      mode: ${{ inputs.mode || fromJson(needs.parse-config.outputs.sync).mode || 'commit' }}
      commit_message: ${{ fromJson(needs.parse-config.outputs.sync).commit_message }}
      git_user_name: ${{ fromJson(needs.parse-config.outputs.sync).git_user_name }}
      git_user_email: ${{ fromJson(needs.parse-config.outputs.sync).git_user_email }}
      push_retries: ${{ fromJson(needs.parse-config.outputs.sync).push_retries }}
      runs_on: ${{ fromJson(needs.parse-config.outputs.sync).runs_on }}
      timeout_minutes: ${{ fromJson(needs.parse-config.outputs.sync).timeout_minutes }}