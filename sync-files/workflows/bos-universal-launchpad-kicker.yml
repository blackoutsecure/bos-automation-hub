# Blackout Secure Launchpad — universal kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
# Required vars (names overridable via `.github/bos-universal-config.json`):
#   DOCKERHUB_NAMESPACE, BALENA_NAMESPACE
# Required secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, BALENA_API_TOKEN
#   UPSTREAM_TOKEN (optional — only for private upstream repos)
name: Blackout Secure Launchpad
run-name: >-
  Blackout Secure Launchpad / ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'full' }} / ${{
    github.event_name == 'workflow_dispatch'
      && (inputs.force_run && 'manual force' || 'manual')
      || github.event_name == 'schedule'
      && (github.event.schedule == '41 3 * * 0' && 'scheduled force rebuild' || 'scheduled')
      || 'push'
  }} / ref:${{ github.ref_name }} / cf-env:${{ vars.CLOUDFLARE_DEPLOYMENT_ENV || 'from-.github/bos-universal-config.json' }} / cf-domain:${{ vars.CLOUDFLARE_SITE_URL || 'from-.github/bos-universal-config.json' }}

"on":
  schedule:
    # Upstream-change check: only releases when the monitor stage detects a
    # new version (or the `41 3 * * 0` cron below forces one regardless).
    - cron: '17 */6 * * *'
    # Weekly forced rebuild (Sun 03:41 UTC): re-runs the full pipeline even
    # with no upstream version change, so base-image/dependency patches still
    # land periodically. Mapped to `force: true` by the "Resolve dispatch"
    # step below via `github.event.schedule`. Add further cron entries there
    # if more scheduled operations are needed later.
    - cron: '41 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'root/**'
      - 'build/**'
      - 'scripts/**'
      - '.github/upstream/**'
      - '.github/bos-universal-config.json'
      - '.github/workflows/bos-universal-launchpad-kicker.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Run the full pipeline, only the release-blocking security scan, or only the managed-file sync.'
        type: choice
        options: [full, security_only, sync_only]
        default: full
      force_run:
        description: 'Force: run pipeline even if upstream unchanged'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Cheap, config-free hub-ref resolution so `sync-check` (which must run
  # BEFORE `parse-config`, since it's a pre-flight) can still pick the
  # matching @dev/@main reusable workflow, same as every dual-branch kicker.
  # Almost always resolves to `main` here in practice: Launchpad's `push`
  # trigger is `branches: [main]` only, so only `workflow_dispatch` runs
  # manually launched from a `dev` branch (or `schedule` on a repo whose
  # default branch happens to be `dev`) ever see `ref_name == 'dev'`.
  resolve-target-ref:
    name: Resolve target hub ref
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      target_ref: ${{ steps.target_ref.outputs.ref }}
    steps:
      - name: Checkout hub resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}
          path: hub-runtime
          sparse-checkout: .github/actions/shared/resolve-hub-ref
          sparse-checkout-cone-mode: false
      - name: Resolve target hub ref
        id: target_ref
        uses: ./hub-runtime/.github/actions/shared/resolve-hub-ref
        with:
          event_name: ${{ github.event_name }}
          ref_name: ${{ github.ref_name }}

  # Sync managed files ahead of the release so a stale kicker/config never
  # runs against outdated policy. If the sync commits a change to this
  # kicker file or the consumer config, defer entirely: the commit's push
  # re-triggers a fresh run (see the `push.paths` above), so this run skips
  # the rest of the pipeline instead of executing under a spec that's about
  # to be superseded. Unrelated managed-file drift (docs, community-health,
  # etc.) is committed but does not block this run.
  # Skipped on `schedule`: the standalone sync kicker already owns periodic
  # reconciliation (weekly cron + immediate config-push trigger) across every
  # repo, so the 6h Launchpad cron doesn't need to duplicate that cadence —
  # this pre-flight only needs to run on the triggers that can actually carry
  # a fresh kicker/config commit into the same run (push, manual dispatch).
  # Split dev/main like every other dual-branch kicker (`resolve-target-ref`
  # above picks exactly one of the two).
  sync-check-dev:
    name: Sync managed files (pre-flight, dev)
    needs: resolve-target-ref
    if: github.event_name != 'schedule' && needs.resolve-target-ref.outputs.target_ref == 'dev'
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@dev
    with:
      mode: commit
    secrets: inherit

  sync-check-main:
    name: Sync managed files (pre-flight, main)
    needs: resolve-target-ref
    if: github.event_name != 'schedule' && needs.resolve-target-ref.outputs.target_ref == 'main'
    permissions:
      contents: write
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-sync.yml@main
    with:
      mode: commit
    secrets: inherit

  parse-config:
    name: Parse universal config
    needs: [resolve-target-ref, sync-check-dev, sync-check-main]
    # `sync-check-dev`/`sync-check-main` are mutually exclusive (only one
    # runs; the other reports `skipped`, not `success`) — tolerate either
    # so `always()` doesn't need to fan out across both outcomes below.
    if: >-
      always()
      && !cancelled()
      && needs.resolve-target-ref.result == 'success'
      && (needs.sync-check-dev.result == 'success' || needs.sync-check-dev.result == 'skipped')
      && (needs.sync-check-main.result == 'success' || needs.sync-check-main.result == 'skipped')
      && !contains(needs.sync-check-dev.outputs.changed_files, '.github/workflows/bos-universal-launchpad-kicker.yml')
      && !contains(needs.sync-check-main.outputs.changed_files, '.github/workflows/bos-universal-launchpad-kicker.yml')
      && !contains(needs.sync-check-dev.outputs.changed_files, '.github/bos-universal-config.json')
      && !contains(needs.sync-check-main.outputs.changed_files, '.github/bos-universal-config.json')
    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,
    # supporting both bare label and JSON-array formats. Fallback to
    # `ubuntu-latest` if the variable is not defined in the consumer.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 2
    outputs:
      cfg: ${{ steps.config.outputs.cfg }}
      target_ref: ${{ steps.config.outputs.target_ref }}
      operation: ${{ steps.dispatch.outputs.operation }}
      force_run: ${{ steps.dispatch.outputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse launchpad config
        id: config
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/launchpad@main
        with:
          config_path: .github/bos-universal-config.json
          event_name: ${{ github.event_name }}
          ref_name: ${{ github.ref_name }}
      # Maps each trigger (and, for `schedule`, each individual cron via
      # `github.event.schedule`) to one `operation`/`force` pair, so the
      # release job below reads one resolved pair instead of repeating the
      # per-trigger ternary at every `docker_force`/`balena_force`/etc. input.
      - name: Resolve dispatch operation
        id: dispatch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_FORCE: ${{ inputs.force_run }}
          PUSH_FORCE: ${{ fromJson(steps.config.outputs.cfg).triggers.force_on_push }}
        run: |
          set -euo pipefail
          operation=full
          force=false
          case "${EVENT_NAME}" in
            workflow_dispatch)
              operation="${DISPATCH_OPERATION:-full}"
              [ "${DISPATCH_FORCE}" = "true" ] && force=true
              ;;
            push)
              [ "${PUSH_FORCE}" = "true" ] && force=true
              ;;
            schedule)
              # Add further cron -> operation/force mappings here as needed.
              case "${SCHEDULE}" in
                '41 3 * * 0') force=true ;;
              esac
              ;;
          esac
          echo "operation=${operation}" >> "${GITHUB_OUTPUT}"
          echo "force=${force}" >> "${GITHUB_OUTPUT}"

  # `operation: sync_only` stops here — `sync-check-{dev,main}` above already
  # ran the sync; there's nothing left for the release stage to do.
  release-dev:
    name: Release (dev)
    needs: parse-config
    if: needs.parse-config.outputs.target_ref == 'dev' && needs.parse-config.outputs.operation != 'sync_only'
    permissions:
      contents:        write   # monitor tracking-file commit + GitHub Release publish
      actions:         write   # nested monitor (`gh workflow run`)
      pull-requests:   write   # nested Docker Scout PR annotations
      security-events: write   # nested Docker Scout SARIF upload
      models:          read    # nested release.yml -> github-release.yml AI changelog
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-launchpad.yml@dev
    with:
      upstream_repo:     ${{ fromJson(needs.parse-config.outputs.cfg).upstream.repo || '' }}
      source:            ${{ fromJson(needs.parse-config.outputs.cfg).upstream.source || 'github_release' }}
      upstream_branch:   ${{ fromJson(needs.parse-config.outputs.cfg).upstream.branch || '' }}
      version_file_path: ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_file_path || 'version' }}
      version_regex:     ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_regex || '' }}
      image_ref:         ${{ fromJson(needs.parse-config.outputs.cfg).upstream.image_ref || '' }}
      package_name:      ${{ fromJson(needs.parse-config.outputs.cfg).upstream.package_name || '' }}
      version_url:       ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_url || '' }}
      tag_pattern:       ${{ fromJson(needs.parse-config.outputs.cfg).upstream.tag_pattern || '' }}
      track_file:        ${{ fromJson(needs.parse-config.outputs.cfg).upstream.track_file || '.github/upstream/tracked-release.json' }}
      force_run: ${{ needs.parse-config.outputs.force_run == 'true' }}

      # `security_only` (dispatch input or resolved cron mapping) forces every
      # publish/deploy stage off, while still letting `security_scan` run below.
      docker:           ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.docker == true }}
      balena:           ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.balena == true }}
      github_release:   ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.github_release == true }}
      companion_docker: ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.companion_docker == true }}

      image_name:                ${{ fromJson(needs.parse-config.outputs.cfg).docker.image_name || '' }}
      dockerhub_namespace:       ${{ vars[fromJson(needs.parse-config.outputs.cfg).docker.namespace_var || 'DOCKERHUB_NAMESPACE'] }}
      docker_extra_tags:         ${{ fromJson(needs.parse-config.outputs.cfg).docker.extra_tags || '' }}
      docker_short_description:  ${{ fromJson(needs.parse-config.outputs.cfg).docker.short_description || '' }}
      docker_latest:             ${{ fromJson(needs.parse-config.outputs.cfg).docker.latest != false }}
      docker_multi_arch:         ${{ fromJson(needs.parse-config.outputs.cfg).docker.multi_arch != false }}
      docker_update_description: ${{ fromJson(needs.parse-config.outputs.cfg).docker.update_description != false }}
      docker_force: ${{ needs.parse-config.outputs.force_run == 'true' }}

      # ----- Docker Scout -----
      docker_enable_scout:             ${{ fromJson(needs.parse-config.outputs.cfg).scout.enable != false }}
      docker_scout_command:            ${{ fromJson(needs.parse-config.outputs.cfg).scout.command || 'cves' }}
      docker_scout_severities:         ${{ fromJson(needs.parse-config.outputs.cfg).scout.severities || 'critical,high' }}
      docker_scout_only_fixed:         ${{ fromJson(needs.parse-config.outputs.cfg).scout.only_fixed == true }}
      docker_scout_ignore_base:        ${{ fromJson(needs.parse-config.outputs.cfg).scout.ignore_base == true }}
      docker_scout_organization:       ${{ fromJson(needs.parse-config.outputs.cfg).scout.organization || '' }}
      docker_scout_record_environment: ${{ fromJson(needs.parse-config.outputs.cfg).scout.record_environment || '' }}
      docker_scout_sarif_upload:       ${{ fromJson(needs.parse-config.outputs.cfg).scout.sarif_upload != false }}
      docker_scout_exit_code:          ${{ fromJson(needs.parse-config.outputs.cfg).scout.exit_code == true }}
      docker_scout_enable_repo:        ${{ fromJson(needs.parse-config.outputs.cfg).scout.enable_repo != false }}

      # ----- Balena stage -----
      block_name:                 ${{ fromJson(needs.parse-config.outputs.cfg).balena.block_name || '' }}
      balena_namespace:           ${{ vars[fromJson(needs.parse-config.outputs.cfg).balena.namespace_var || 'BALENA_NAMESPACE'] }}
      balena_sync_yml:            ${{ fromJson(needs.parse-config.outputs.cfg).balena.sync_yml != false }}
      balena_draft:               ${{ fromJson(needs.parse-config.outputs.cfg).balena.draft == true }}
      balena_force: ${{ needs.parse-config.outputs.force_run == 'true' }}
      balena_generate_yml:        ${{ fromJson(needs.parse-config.outputs.cfg).balena.generate_yml == true }}
      balena_type:                ${{ fromJson(needs.parse-config.outputs.cfg).balena.type || 'sw.block' }}
      balena_repository_url:      ${{ fromJson(needs.parse-config.outputs.cfg).balena.repository_url || '' }}
      balena_logo_url:            ${{ fromJson(needs.parse-config.outputs.cfg).balena.logo_url || '' }}
      balena_default_device_type: ${{ fromJson(needs.parse-config.outputs.cfg).balena.default_device_type || '' }}
      # `|-` chomps the trailing newline that a plain `|` block would
      # add at each forwarding hop, so multi-line caller values stay
      # byte-stable through the kicker → launchpad → release.yml chain.
      balena_description: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.description || '' }}
      balena_post_provisioning: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.post_provisioning || '' }}
      balena_supported_device_types: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.supported_device_types || '' }}

      # ----- Companion Docker stage -----
      companion_image_name:               ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.image_name || '' }}
      companion_build_target:             ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.build_target || '' }}
      companion_docker_short_description: ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.short_description || '' }}

      # ----- Cloudflare Pages stage -----
      cloudflare_pages:                     ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.cloudflare_pages == true }}
      cloudflare_project_name:              ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.project_name || '' }}
      cloudflare_deployment_environment:    ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deployment_environment || '' }}
      cloudflare_site_url:                  ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.site_url || '' }}
      cloudflare_public_dir:                ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.public_dir || '.' }}
      cloudflare_deploy_dir:                ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy_dir || './dist' }}
      cloudflare_clean_deploy_dir:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.clean_deploy_dir != false }}
      cloudflare_copy_files: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.copy_files || '' }}
      cloudflare_copy_dirs: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.copy_dirs || '' }}
      cloudflare_prebuild_command:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.prebuild_command || '' }}
      cloudflare_working_directory:         ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.working_directory || '' }}
      cloudflare_branch:                    ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.branch || '' }}
      cloudflare_commit_message:            ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.commit_message || '' }}
      cloudflare_wrangler_version:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.wrangler_version || '' }}
      cloudflare_extra_wrangler_args:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.extra_wrangler_args || '' }}
      cloudflare_ai_bindings:               ${{ toJson(fromJson(needs.parse-config.outputs.cfg).cloudflare.ai_bindings || fromJson('[]')) }}
      cloudflare_deploy_artifact_name:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy_artifact_name || '' }}
      cloudflare_deploy:                    ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy || '' }}
      cloudflare_runs_on:                   ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.runs_on || '' }}
      cloudflare_checkout_fetch_depth:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.checkout_fetch_depth || 0 }}
      cloudflare_purge_cache:               ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.purge_cache != false }}

      # ----- Cloudflare generators -----
      cloudflare_generate_sitemap:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_sitemap == true }}
      cloudflare_generate_robots:           ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_robots == true }}
      cloudflare_generate_security_txt:     ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_security_txt == true }}
      cloudflare_generate_humans_txt:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_humans_txt == true }}
      cloudflare_security_contact:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.security_contact || '' }}
      cloudflare_generate_manifest:         ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_manifest == true }}
      cloudflare_manifest_name:             ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_name || '' }}
      cloudflare_manifest_short_name:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_short_name || '' }}
      cloudflare_manifest_description:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_description || '' }}
      cloudflare_manifest_orientation:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_orientation || '' }}
      cloudflare_manifest_theme_color:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_theme_color || '' }}
      cloudflare_manifest_background_color: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_background_color || '' }}
      cloudflare_manifest_lang:             ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_lang || '' }}
      cloudflare_manifest_dir:              ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_dir || '' }}
      cloudflare_manifest_categories:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_categories || '' }}
      cloudflare_manifest_icons_dir:        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_icons_dir || '' }}
      cloudflare_generate_redirects:        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_redirects == true }}
      cloudflare_redirects_custom_rules: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.redirects_custom_rules || '' }}
      cloudflare_redirects_replace_existing: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.redirects_replace_existing == true }}

      # ----- Cloudflare headers generator -----
      cloudflare_generate_headers:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_headers == true }}
      cloudflare_headers_presets:           ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_presets || 'security,cache' }}
      cloudflare_headers_csp:               ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_csp || '' }}
      cloudflare_headers_hsts_max_age:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_hsts_max_age || '63072000' }}
      cloudflare_headers_permissions_policy: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_permissions_policy || 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()' }}
      cloudflare_headers_cache_html_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_html_control || 'public, max-age=0, must-revalidate' }}
      cloudflare_headers_cache_assets_pattern: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_assets_pattern || '/assets/*' }}
      cloudflare_headers_cache_assets_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_assets_control || 'public, max-age=31536000, immutable' }}
      cloudflare_generate_common_content_headers: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_common_content_headers != false }}
      cloudflare_common_security_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_security_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_common_robots_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_robots_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_common_sitemap_xml_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_sitemap_xml_cache_control || 'public, max-age=86400' }}
      cloudflare_common_humans_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_humans_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_headers_custom_rules: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_custom_rules || '' }}
      cloudflare_headers_replace_existing:  ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_replace_existing == true }}

      # ----- GitHub Release stage -----
      release_template_path:  ${{ fromJson(needs.parse-config.outputs.cfg).release.template_path || '' }}
      release_extra_context:  ${{ fromJson(needs.parse-config.outputs.cfg).release.extra_context || '' }}
      generate_release_notes: ${{ fromJson(needs.parse-config.outputs.cfg).release.generate_notes != false }}
      release_files:          ${{ fromJson(needs.parse-config.outputs.cfg).release.files || '' }}
      release_draft:          ${{ fromJson(needs.parse-config.outputs.cfg).release.draft == true }}

      # ----- Shared -----
      platforms: ${{ fromJson(needs.parse-config.outputs.cfg).platforms || 'linux/amd64,linux/arm64' }}

      # ----- Universal kicker wiring -----
      use_launchpad_config: true

      # ----- Optional stages configured from data file -----
      enable_security_scan:         ${{ needs.parse-config.outputs.operation == 'security_only' || fromJson(needs.parse-config.outputs.cfg).security_scan.enable != false }}
      security_scan_fail_on:        ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.fail_on || 'fail' }}
      security_scan_blocks_release: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.blocks_release != false }}
      security_scan_enable_kit_composite: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_kit_composite != false }}
      security_scan_enable_posture:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_posture != false }}
      security_scan_enable_scanners:      ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_scanners != false }}
      security_scan_enable_upload:        ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_upload != false }}
      security_scan_codeql_languages:     ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_languages || '' }}
      security_scan_codeql_queries:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_queries || 'security-and-quality' }}
      security_scan_codeql_runs_on:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_runs_on || '' }}
      security_scan_use_advanced_pat:     ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.use_advanced_pat == true }}

      enable_repo_metadata:          ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.enable == true }}
      repo_metadata_description:     ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.description || '' }}
      repo_metadata_description_mode: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.description_mode || 'auto' }}
      repo_metadata_description_fallback: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.description_fallback || '' }}
      repo_metadata_homepage:        ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.homepage || '' }}
      repo_metadata_topics:          ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics || '' }}
      repo_metadata_generate_topics: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.generate_topics == true }}
      repo_metadata_topics_fallback: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics_fallback || '' }}
      repo_metadata_ai_enabled:      ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_enabled != false }}
      repo_metadata_ai_model:        ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_model || 'auto' }}
      repo_metadata_show_releases:   ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_releases != false }}
      repo_metadata_show_deployments: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_deployments == true }}
      repo_metadata_show_packages:   ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_packages == true }}
      repo_metadata_dry_run:         ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.dry_run == true }}
    secrets: inherit

  release-main:
    name: Release (main)
    needs: parse-config
    if: needs.parse-config.outputs.target_ref == 'main' && needs.parse-config.outputs.operation != 'sync_only'
    permissions:
      contents:        write   # monitor tracking-file commit + GitHub Release publish
      actions:         write   # nested monitor (`gh workflow run`)
      pull-requests:   write   # nested Docker Scout PR annotations
      security-events: write   # nested Docker Scout SARIF upload
      models:          read    # nested release.yml -> github-release.yml AI changelog
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-launchpad.yml@main
    with:
      upstream_repo:     ${{ fromJson(needs.parse-config.outputs.cfg).upstream.repo || '' }}
      source:            ${{ fromJson(needs.parse-config.outputs.cfg).upstream.source || 'github_release' }}
      upstream_branch:   ${{ fromJson(needs.parse-config.outputs.cfg).upstream.branch || '' }}
      version_file_path: ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_file_path || 'version' }}
      version_regex:     ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_regex || '' }}
      image_ref:         ${{ fromJson(needs.parse-config.outputs.cfg).upstream.image_ref || '' }}
      package_name:      ${{ fromJson(needs.parse-config.outputs.cfg).upstream.package_name || '' }}
      version_url:       ${{ fromJson(needs.parse-config.outputs.cfg).upstream.version_url || '' }}
      tag_pattern:       ${{ fromJson(needs.parse-config.outputs.cfg).upstream.tag_pattern || '' }}
      track_file:        ${{ fromJson(needs.parse-config.outputs.cfg).upstream.track_file || '.github/upstream/tracked-release.json' }}
      force_run: ${{ needs.parse-config.outputs.force_run == 'true' }}

      # `security_only` (dispatch input or resolved cron mapping) forces every
      # publish/deploy stage off, while still letting `security_scan` run below.
      docker:           ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.docker == true }}
      balena:           ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.balena == true }}
      github_release:   ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.github_release == true }}
      companion_docker: ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.companion_docker == true }}

      image_name:                ${{ fromJson(needs.parse-config.outputs.cfg).docker.image_name || '' }}
      dockerhub_namespace:       ${{ vars[fromJson(needs.parse-config.outputs.cfg).docker.namespace_var || 'DOCKERHUB_NAMESPACE'] }}
      docker_extra_tags:         ${{ fromJson(needs.parse-config.outputs.cfg).docker.extra_tags || '' }}
      docker_short_description:  ${{ fromJson(needs.parse-config.outputs.cfg).docker.short_description || '' }}
      docker_latest:             ${{ fromJson(needs.parse-config.outputs.cfg).docker.latest != false }}
      docker_multi_arch:         ${{ fromJson(needs.parse-config.outputs.cfg).docker.multi_arch != false }}
      docker_update_description: ${{ fromJson(needs.parse-config.outputs.cfg).docker.update_description != false }}
      docker_force: ${{ needs.parse-config.outputs.force_run == 'true' }}

      # ----- Docker Scout -----
      docker_enable_scout:             ${{ fromJson(needs.parse-config.outputs.cfg).scout.enable != false }}
      docker_scout_command:            ${{ fromJson(needs.parse-config.outputs.cfg).scout.command || 'cves' }}
      docker_scout_severities:         ${{ fromJson(needs.parse-config.outputs.cfg).scout.severities || 'critical,high' }}
      docker_scout_only_fixed:         ${{ fromJson(needs.parse-config.outputs.cfg).scout.only_fixed == true }}
      docker_scout_ignore_base:        ${{ fromJson(needs.parse-config.outputs.cfg).scout.ignore_base == true }}
      docker_scout_organization:       ${{ fromJson(needs.parse-config.outputs.cfg).scout.organization || '' }}
      docker_scout_record_environment: ${{ fromJson(needs.parse-config.outputs.cfg).scout.record_environment || '' }}
      docker_scout_sarif_upload:       ${{ fromJson(needs.parse-config.outputs.cfg).scout.sarif_upload != false }}
      docker_scout_exit_code:          ${{ fromJson(needs.parse-config.outputs.cfg).scout.exit_code == true }}
      docker_scout_enable_repo:        ${{ fromJson(needs.parse-config.outputs.cfg).scout.enable_repo != false }}

      # ----- Balena stage -----
      block_name:                 ${{ fromJson(needs.parse-config.outputs.cfg).balena.block_name || '' }}
      balena_namespace:           ${{ vars[fromJson(needs.parse-config.outputs.cfg).balena.namespace_var || 'BALENA_NAMESPACE'] }}
      balena_sync_yml:            ${{ fromJson(needs.parse-config.outputs.cfg).balena.sync_yml != false }}
      balena_draft:               ${{ fromJson(needs.parse-config.outputs.cfg).balena.draft == true }}
      balena_force: ${{ needs.parse-config.outputs.force_run == 'true' }}
      balena_generate_yml:        ${{ fromJson(needs.parse-config.outputs.cfg).balena.generate_yml == true }}
      balena_type:                ${{ fromJson(needs.parse-config.outputs.cfg).balena.type || 'sw.block' }}
      balena_repository_url:      ${{ fromJson(needs.parse-config.outputs.cfg).balena.repository_url || '' }}
      balena_logo_url:            ${{ fromJson(needs.parse-config.outputs.cfg).balena.logo_url || '' }}
      balena_default_device_type: ${{ fromJson(needs.parse-config.outputs.cfg).balena.default_device_type || '' }}
      # `|-` chomps the trailing newline that a plain `|` block would
      # add at each forwarding hop, so multi-line caller values stay
      # byte-stable through the kicker → launchpad → release.yml chain.
      balena_description: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.description || '' }}
      balena_post_provisioning: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.post_provisioning || '' }}
      balena_supported_device_types: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).balena.supported_device_types || '' }}

      # ----- Companion Docker stage -----
      companion_image_name:               ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.image_name || '' }}
      companion_build_target:             ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.build_target || '' }}
      companion_docker_short_description: ${{ fromJson(needs.parse-config.outputs.cfg).companion_docker.short_description || '' }}

      # ----- Cloudflare Pages stage -----
      cloudflare_pages:                     ${{ needs.parse-config.outputs.operation != 'security_only' && fromJson(needs.parse-config.outputs.cfg).stages.cloudflare_pages == true }}
      cloudflare_project_name:              ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.project_name || '' }}
      cloudflare_deployment_environment:    ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deployment_environment || '' }}
      cloudflare_site_url:                  ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.site_url || '' }}
      cloudflare_public_dir:                ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.public_dir || '.' }}
      cloudflare_deploy_dir:                ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy_dir || './dist' }}
      cloudflare_clean_deploy_dir:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.clean_deploy_dir != false }}
      cloudflare_copy_files: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.copy_files || '' }}
      cloudflare_copy_dirs: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.copy_dirs || '' }}
      cloudflare_prebuild_command:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.prebuild_command || '' }}
      cloudflare_working_directory:         ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.working_directory || '' }}
      cloudflare_branch:                    ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.branch || '' }}
      cloudflare_commit_message:            ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.commit_message || '' }}
      cloudflare_wrangler_version:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.wrangler_version || '' }}
      cloudflare_extra_wrangler_args:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.extra_wrangler_args || '' }}
      cloudflare_ai_bindings:               ${{ toJson(fromJson(needs.parse-config.outputs.cfg).cloudflare.ai_bindings || fromJson('[]')) }}
      cloudflare_deploy_artifact_name:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy_artifact_name || '' }}
      cloudflare_deploy:                    ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.deploy || '' }}
      cloudflare_runs_on:                   ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.runs_on || '' }}
      cloudflare_checkout_fetch_depth:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.checkout_fetch_depth || 0 }}
      cloudflare_purge_cache:               ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.purge_cache != false }}

      # ----- Cloudflare generators -----
      cloudflare_generate_sitemap:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_sitemap == true }}
      cloudflare_generate_robots:           ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_robots == true }}
      cloudflare_generate_security_txt:     ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_security_txt == true }}
      cloudflare_generate_humans_txt:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_humans_txt == true }}
      cloudflare_security_contact:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.security_contact || '' }}
      cloudflare_generate_manifest:         ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_manifest == true }}
      cloudflare_manifest_name:             ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_name || '' }}
      cloudflare_manifest_short_name:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_short_name || '' }}
      cloudflare_manifest_description:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_description || '' }}
      cloudflare_manifest_orientation:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_orientation || '' }}
      cloudflare_manifest_theme_color:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_theme_color || '' }}
      cloudflare_manifest_background_color: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_background_color || '' }}
      cloudflare_manifest_lang:             ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_lang || '' }}
      cloudflare_manifest_dir:              ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_dir || '' }}
      cloudflare_manifest_categories:       ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_categories || '' }}
      cloudflare_manifest_icons_dir:        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.manifest_icons_dir || '' }}
      cloudflare_generate_redirects:        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_redirects == true }}
      cloudflare_redirects_custom_rules: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.redirects_custom_rules || '' }}
      cloudflare_redirects_replace_existing: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.redirects_replace_existing == true }}

      # ----- Cloudflare headers generator -----
      cloudflare_generate_headers:          ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_headers == true }}
      cloudflare_headers_presets:           ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_presets || 'security,cache' }}
      cloudflare_headers_csp:               ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_csp || '' }}
      cloudflare_headers_hsts_max_age:      ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_hsts_max_age || '63072000' }}
      cloudflare_headers_permissions_policy: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_permissions_policy || 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()' }}
      cloudflare_headers_cache_html_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_html_control || 'public, max-age=0, must-revalidate' }}
      cloudflare_headers_cache_assets_pattern: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_assets_pattern || '/assets/*' }}
      cloudflare_headers_cache_assets_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_cache_assets_control || 'public, max-age=31536000, immutable' }}
      cloudflare_generate_common_content_headers: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.generate_common_content_headers != false }}
      cloudflare_common_security_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_security_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_common_robots_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_robots_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_common_sitemap_xml_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_sitemap_xml_cache_control || 'public, max-age=86400' }}
      cloudflare_common_humans_txt_cache_control: ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.common_humans_txt_cache_control || 'public, max-age=86400' }}
      cloudflare_headers_custom_rules: |-
        ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_custom_rules || '' }}
      cloudflare_headers_replace_existing:  ${{ fromJson(needs.parse-config.outputs.cfg).cloudflare.headers_replace_existing == true }}

      # ----- GitHub Release stage -----
      release_template_path:  ${{ fromJson(needs.parse-config.outputs.cfg).release.template_path || '' }}
      release_extra_context:  ${{ fromJson(needs.parse-config.outputs.cfg).release.extra_context || '' }}
      generate_release_notes: ${{ fromJson(needs.parse-config.outputs.cfg).release.generate_notes != false }}
      release_files:          ${{ fromJson(needs.parse-config.outputs.cfg).release.files || '' }}
      release_draft:          ${{ fromJson(needs.parse-config.outputs.cfg).release.draft == true }}

      # ----- Shared -----
      platforms: ${{ fromJson(needs.parse-config.outputs.cfg).platforms || 'linux/amd64,linux/arm64' }}

      # ----- Universal kicker wiring -----
      use_launchpad_config: true

      # ----- Optional stages configured from data file -----
      enable_security_scan:         ${{ needs.parse-config.outputs.operation == 'security_only' || fromJson(needs.parse-config.outputs.cfg).security_scan.enable != false }}
      security_scan_fail_on:        ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.fail_on || 'fail' }}
      security_scan_blocks_release: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.blocks_release != false }}
      security_scan_enable_kit_composite: ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_kit_composite != false }}
      security_scan_enable_posture:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_posture != false }}
      security_scan_enable_scanners:      ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_scanners != false }}
      security_scan_enable_upload:        ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.enable_upload != false }}
      security_scan_codeql_languages:     ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_languages || '' }}
      security_scan_codeql_queries:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_queries || 'security-and-quality' }}
      security_scan_codeql_runs_on:       ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.codeql_runs_on || '' }}
      security_scan_use_advanced_pat:     ${{ fromJson(needs.parse-config.outputs.cfg).security_scan.use_advanced_pat == true }}

      enable_repo_metadata:          ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.enable == true }}
      repo_metadata_description:     ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.description || '' }}
      repo_metadata_homepage:        ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.homepage || '' }}
      repo_metadata_topics:          ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics || '' }}
      repo_metadata_generate_topics: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.generate_topics == true }}
      repo_metadata_topics_fallback: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.topics_fallback || '' }}
      repo_metadata_ai_enabled:      ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_enabled != false }}
      repo_metadata_ai_model:        ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.ai_model || 'auto' }}
      repo_metadata_show_releases:   ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_releases != false }}
      repo_metadata_show_deployments: ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_deployments == true }}
      repo_metadata_show_packages:   ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.show_packages == true }}
      repo_metadata_dry_run:         ${{ fromJson(needs.parse-config.outputs.cfg).repo_metadata.dry_run == true }}
    secrets: inherit
